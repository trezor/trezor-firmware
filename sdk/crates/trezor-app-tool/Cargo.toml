[package]
name = "trezor-app-tool"
version = "0.1.0"
edition = "2024"
description = "Build and test tool for Trezor external apps"
license = "GPL-3.0-only"
exclude = ["supply-chain/"]

[dependencies]
base64 = "0.22"
clap = { version = "4.6.0", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
cargo_metadata = "0.23.1"
# ML-DSA-44 for dev-signing RootPackets. Chosen over RustCrypto's `ml-dsa`
# for its smaller supply chain: it adds 6 crates, of which only `fips204`
# itself lacks an audit in our cargo-vet imports (`ml-dsa` adds 11, 6 unaudited).
fips204 = { version = "0.5.0", default-features = false, features = ["ml-dsa-44"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
anyhow = "1.0.71"
object = { version = "0.37.3", default-features = false, features = ["read_core", "elf", "std"] }
sha2 = "0.10.9"
zerocopy = "0.8.27"
zerocopy-derive = "0.8.27"
protox = "0.9.1"
prost-types = "0.14"
