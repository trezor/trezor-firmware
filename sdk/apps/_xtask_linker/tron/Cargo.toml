# Generated by `xtask modular build` -- do not edit, do not commit.
cargo-features = ["panic-immediate-abort"]

[profile.debug-fw]
inherits = "dev"
split-debuginfo = "off"
debug = 2
strip = "none"
panic = "abort"

[profile.release-fw]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
split-debuginfo = "off"
debug = 0
debug-assertions = false
overflow-checks = false
incremental = false
panic = "immediate-abort"

[workspace]

[package]
name = "tron-xtask-linker"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "tron"
path = "main.rs"

[dependencies]
tron = { path = "../../tron" }
