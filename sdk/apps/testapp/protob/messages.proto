syntax = "proto2";
package hw.trezor.messages;

/**
 * Messages for Trezor communication
 */

/**
 * Mapping between Trezor wire identifier (uint) and a protobuf message
 */
enum MessageType {
    MessageType_Hash = 0;
    MessageType_Hmac = 1;
    MessageType_Digest = 2;
    MessageType_GetXpub = 3;
    MessageType_Xpub = 4;
    MessageType_GetPublicKey = 5;
    MessageType_PublicKey = 6;
    MessageType_EcdsaSignDigest = 7;
    MessageType_Ed25519Sign = 8;
    MessageType_Signature = 9;
    MessageType_GetAddressMac = 10;
    MessageType_AddressMac = 11;
    MessageType_CheckAddressMac = 12;
    MessageType_VerifyNonceCache = 13;
    MessageType_Bool = 14;
    MessageType_EcdsaVerify = 15;
    MessageType_EcdsaVerifyDigest = 16;
    MessageType_EcdsaRecoverPubkey = 17;
    MessageType_Ed25519Verify = 18;
    MessageType_CosiVerify = 19;
    MessageType_Success = 20;
    MessageType_CosiCombinePublicKeys = 21;
    MessageType_Base58Encode = 22;
    MessageType_Base58Decode = 23;
    MessageType_Base58CheckEncode = 24;
    MessageType_Base58CheckDecode = 25;
    MessageType_Base58 = 26;
    MessageType_Data = 27;
    MessageType_Review = 28;
    MessageType_Danger = 29;
    MessageType_Details = 30;
    MessageType_VerifyAddress = 31;
    MessageType_VerifyPubkey = 32;
    MessageType_Done = 33;
    MessageType_ShowProgress = 34;
    MessageType_UiResult = 35;
    MessageType_ProgressTick = 36;
    MessageType_ProgressStep = 37;
    MessageType_ProgressEnd = 38;
    MessageType_Showcase = 39;
    MessageType_ProgressLabel = 40;
    MessageType_StreamData = 41;
}
