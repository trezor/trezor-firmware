syntax = "proto2";
package hw.trezor.testapp;

/**
 * One request per SDK crypto function (`trezor_app_sdk::crypto`), mirroring
 * its parameters one to one, so the host exercises the same surface an app
 * uses. The app answers with the function's result; an error the function
 * returns comes back as a Failure.
 */

enum HashAlgorithm {
    Sha256 = 0;
    Sha3_256 = 1;
    Sha512 = 2;
    Keccak256 = 3;
    Sha3_512 = 4;
    Keccak512 = 5;
}

enum HmacAlgorithm {
    HmacSha256 = 0;
    HmacSha512 = 1;
}

enum EcdsaCurve {
    Secp256k1 = 0;
    Nist256p1 = 1;
}

enum CanonicalSig {
    Any = 0;
    Ethereum = 1;
}

/**
 * Request: crypto::get_hasher, fed `chunks` one update at a time
 * @next Digest
 */
message Hash {
    required HashAlgorithm algorithm = 1;
    repeated bytes chunks = 2;
}

/**
 * Request: crypto::get_hmac, fed `chunks` one update at a time
 * @next Digest
 */
message Hmac {
    required HmacAlgorithm algorithm = 1;
    required bytes key = 2;
    repeated bytes chunks = 3;
}

/**
 * Response: a hasher's final digest
 * @end
 */
message Digest {
    required bytes digest = 1;
}

/**
 * Request: crypto::get_xpub
 * @next Xpub
 */
message GetXpub {
    repeated uint32 address_n = 1;
    required uint32 xpub_magic = 2;
}

/**
 * Response: a base58check-encoded extended public key
 * @end
 */
message Xpub {
    required string xpub = 1;
}

/**
 * Request: crypto::get_public_key
 * @next PublicKey
 */
message GetPublicKey {
    repeated uint32 address_n = 1;
    required bool compressed = 2;
}

/**
 * Response: a public key
 * @end
 */
message PublicKey {
    required bytes public_key = 1;
}

/**
 * Request: crypto::ecdsa_sign_digest; `digest` must be 32 bytes
 * @next Signature
 */
message EcdsaSignDigest {
    repeated uint32 address_n = 1;
    required bytes digest = 2;
    required bool compressed = 3;
    required CanonicalSig canonical = 4;
}

/**
 * Request: crypto::ed25519_sign
 * @next Signature
 */
message Ed25519Sign {
    repeated uint32 address_n = 1;
    required bytes message = 2;
}

/**
 * Response: a 65-byte ECDSA or a 64-byte Ed25519 signature
 * @end
 */
message Signature {
    required bytes signature = 1;
}

/**
 * Request: crypto::get_address_mac
 * @next AddressMac
 */
message GetAddressMac {
    repeated uint32 address_n = 1;
    required string address = 2;
    required uint32 slip44 = 3;
}

/**
 * Response: a 32-byte address MAC
 * @end
 */
message AddressMac {
    required bytes mac = 1;
}

/**
 * Request: crypto::check_address_mac; `mac` must be 32 bytes
 * @next Success
 */
message CheckAddressMac {
    repeated uint32 address_n = 1;
    required bytes mac = 2;
    required string address = 3;
    required uint32 slip44 = 4;
}

/**
 * Request: crypto::verify_nonce_cache
 * @next Bool
 */
message VerifyNonceCache {
    required bytes nonce = 1;
}

/**
 * Response: a boolean result
 * @end
 */
message Bool {
    required bool value = 1;
}

/**
 * Request: crypto::ecdsa_verify_digest of the message's SHA-256 digest
 * @next Success
 */
message EcdsaVerify {
    required EcdsaCurve curve = 1;
    required bytes public_key = 2;
    required bytes signature = 3;
    required bytes message = 4;
}

/**
 * Request: crypto::ecdsa_verify_digest
 * @next Success
 */
message EcdsaVerifyDigest {
    required EcdsaCurve curve = 1;
    required bytes public_key = 2;
    required bytes signature = 3;
    required bytes digest = 4;
}

/**
 * Request: crypto::ecdsa_recover_pubkey
 * @next PublicKey
 */
message EcdsaRecoverPubkey {
    required EcdsaCurve curve = 1;
    required bytes signature = 2;
    required bytes digest = 3;
}

/**
 * Request: crypto::ed25519_verify
 * @next Success
 */
message Ed25519Verify {
    required bytes public_key = 1;
    required bytes signature = 2;
    required bytes message = 3;
}

/**
 * Request: crypto::cosi_verify; `threshold` and `sigmask` must fit in a
 * byte, every public key must be 32 bytes
 * @next Success
 */
message CosiVerify {
    required uint32 threshold = 1;
    required bytes message = 2;
    repeated bytes public_keys = 3;
    required uint32 sigmask = 4;
    required bytes signature = 5;
}

/**
 * Response: the function succeeded
 * @end
 */
message Success {}

/**
 * Request: crypto::cosi_combine_publickeys; every public key must be 32 bytes
 * @next PublicKey
 */
message CosiCombinePublicKeys {
    repeated bytes public_keys = 1;
}

/**
 * Request: crypto::base58_encode
 * @next Base58
 */
message Base58Encode {
    required bytes data = 1;
}

/**
 * Request: crypto::base58_decode
 * @next Data
 */
message Base58Decode {
    required string encoded = 1;
}

/**
 * Request: crypto::base58check_encode
 * @next Base58
 */
message Base58CheckEncode {
    required bytes data = 1;
}

/**
 * Request: crypto::base58check_decode
 * @next Data
 */
message Base58CheckDecode {
    required string encoded = 1;
}

/**
 * Response: a base58 string
 * @end
 */
message Base58 {
    required string encoded = 1;
}

/**
 * Response: decoded bytes
 * @end
 */
message Data {
    required bytes data = 1;
}

/**
 * One request per modui layout. Each mirrors its layout's parameters one to
 * one, so the host drives the library through the same surface an app uses.
 * `step` is the step name the host sees for that screen. The app answers with
 * a UiResult.
 */

// Prefixed because enum values share the package's namespace (`Data` is also a
// message); prost and the Python generator both strip the prefix.
enum FieldKind {
    FieldKind_Text = 0;
    FieldKind_Amount = 1;
    FieldKind_Address = 2;
    FieldKind_Data = 3;
    FieldKind_Note = 4;
    FieldKind_Warning = 5;
}

/**
 * One fact the person reads. `label` is absent for a note and a warning;
 * `value` is UTF-8 for the text kinds and the bytes themselves for `Data`.
 * `ticker` is an amount's unit, apart from its number.
 */
message Field {
    optional FieldKind kind = 1 [default = FieldKind_Text];
    optional string label = 2;
    required bytes value = 3;
    optional string ticker = 4;
}

/**
 * More the person can open from a review's menu.
 */
message Extra {
    required string label = 1;
    repeated Field fields = 2;
}

/**
 * Request: modui::review, confirmed by `is_final`
 * @next UiResult
 */
message Review {
    required string step = 1;
    required string title = 2;
    repeated Field fields = 3;
    repeated Extra extras = 4;
    optional bool is_final = 5 [default = false];
}

/**
 * Request: modui::review(...).confirm_danger()
 * @next UiResult
 */
message Danger {
    required string step = 1;
    required string title = 2;
    repeated Field fields = 3;
}

/**
 * Request: modui::details
 * @next UiResult
 */
message Details {
    required string step = 1;
    required string title = 2;
    repeated Field fields = 3;
}

/**
 * Request: a review with a `data_source` field the app generates while core
 * pulls it, then a final review of the hash and of the number of reads
 * @next UiResult
 */
message StreamData {
    required string step = 1;
    required string title = 2;
    required uint32 length = 3;
    optional uint32 fail_at = 4;
}

/**
 * Request: modui::verify_address
 * @next UiResult
 */
message VerifyAddress {
    required string step = 1;
    required string value = 2;
    optional string account = 3;
    optional string path = 4;
}

/**
 * Request: modui::verify_pubkey
 * @next UiResult
 */
message VerifyPubkey {
    required string step = 1;
    required string value = 2;
    optional string account = 3;
    optional string path = 4;
}

/**
 * Request: modui::done; the app answers once the screen is up.
 * @next UiResult
 */
message Done {
    required string step = 1;
    required string text = 2;
}

/**
 * Request: one flow from the API reference's examples, by name; see
 * `src/showcase.rs`.
 * @next UiResult
 */
message Showcase {
    required string name = 1;
}

/**
 * Request: modui::progress, paced by the host.
 * The progress stays up while the app asks for steps with `ProgressTick`; the
 * host answers each tick with `ProgressStep`, `ProgressLabel` or
 * `ProgressReview`, or with `ProgressEnd` to finish. Without `total` the progress
 * is indeterminate.
 * @next ProgressTick
 */
message ShowProgress {
    required string label = 1;
    optional uint32 total = 2;
}

/**
 * The app's question while a progress runs: what next?
 * @next ProgressStep
 * @next ProgressLabel
 * @next ProgressReview
 * @next ProgressEnd
 */
message ProgressTick {}

/**
 * Report `units` more units of work done.
 * @next ProgressTick
 */
message ProgressStep {
    optional uint32 units = 1 [default = 1];
}

/**
 * Change the text under the bar.
 * @next ProgressTick
 */
message ProgressLabel {
    required string label = 1;
}

/**
 * Show a review inside the progress's work; the app asks for the next tick once
 * the person confirms it.
 * @next ProgressTick
 */
message ProgressReview {
    required string step = 1;
    required string title = 2;
}

/**
 * Start a progress inside the running one. Core refuses the nesting and stops the
 * app, so this never answers.
 */
message ProgressNested {
    required string label = 1;
}

/**
 * The work is over; the progress goes away.
 * @next UiResult
 */
message ProgressEnd {}

/**
 * Response: how the layout ended. A details answers `ShowDetails` when the
 * person asked for them and `Confirmed` when they skipped them; a progress
 * answers `Confirmed` once it has run.
 * @end
 */
message UiResult {
    enum Reply {
        Confirmed = 0;
        Cancelled = 1;
        ShowDetails = 5;
    }
    required Reply reply = 1;
}
