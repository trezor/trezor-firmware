syntax = "proto2";
package hw.trezor.testapp;

/**
 * One request per SDK crypto function (`trezor_app_sdk::crypto`), mirroring
 * its parameters one to one, so the host exercises the same surface an app
 * uses. The app answers with the function's result; an error the function
 * returns comes back as a Failure.
 */

enum HashAlgorithm {
    Sha256 = 0;
    Sha3_256 = 1;
    Sha512 = 2;
    Keccak256 = 3;
    Sha3_512 = 4;
    Keccak512 = 5;
}

enum HmacAlgorithm {
    HmacSha256 = 0;
    HmacSha512 = 1;
}

enum EcCurve {
    Secp256k1 = 0;
    Nist256p1 = 1;
    Ed25519 = 2;
}

enum CanonicalSig {
    Any = 0;
    Ethereum = 1;
}

/**
 * Request: crypto::get_hasher, fed `chunks` one update at a time
 * @next Digest
 */
message Hash {
    required HashAlgorithm algorithm = 1;
    repeated bytes chunks = 2;
}

/**
 * Request: crypto::get_hmac, fed `chunks` one update at a time
 * @next Digest
 */
message Hmac {
    required HmacAlgorithm algorithm = 1;
    required bytes key = 2;
    repeated bytes chunks = 3;
}

/**
 * Response: a hasher's final digest
 * @end
 */
message Digest {
    required bytes digest = 1;
}

/**
 * Request: crypto::get_xpub
 * @next Xpub
 */
message GetXpub {
    repeated uint32 address_n = 1;
    required uint32 xpub_magic = 2;
}

/**
 * Response: a base58check-encoded extended public key
 * @end
 */
message Xpub {
    required string xpub = 1;
}

/**
 * Request: crypto::get_public_key
 * @next PublicKey
 */
message GetPublicKey {
    repeated uint32 address_n = 1;
    required bool compressed = 2;
}

/**
 * Response: a public key
 * @end
 */
message PublicKey {
    required bytes public_key = 1;
}

/**
 * Request: crypto::sign_digest; `digest` must be 32 bytes
 * @next Signature
 */
message SignDigest {
    repeated uint32 address_n = 1;
    required bytes digest = 2;
    required bool compressed = 3;
    required CanonicalSig canonical = 4;
}

/**
 * Response: a 65-byte signature
 * @end
 */
message Signature {
    required bytes signature = 1;
}

/**
 * Request: crypto::get_address_mac
 * @next AddressMac
 */
message GetAddressMac {
    repeated uint32 address_n = 1;
    required string address = 2;
    required uint32 slip44 = 3;
}

/**
 * Response: a 32-byte address MAC
 * @end
 */
message AddressMac {
    required bytes mac = 1;
}

/**
 * Request: crypto::check_address_mac; `mac` must be 32 bytes
 * @next Bool
 */
message CheckAddressMac {
    repeated uint32 address_n = 1;
    required bytes mac = 2;
    required string address = 3;
    required uint32 slip44 = 4;
}

/**
 * Request: crypto::verify_nonce_cache
 * @next Bool
 */
message VerifyNonceCache {
    required bytes nonce = 1;
}

/**
 * Response: a boolean result
 * @end
 */
message Bool {
    required bool value = 1;
}

/**
 * Request: crypto::ec_verify_recover
 * @next PublicKey
 */
message EcVerifyRecover {
    required EcCurve curve = 1;
    required bytes public_key = 2;
    required bytes signature = 3;
    required bytes message = 4;
}

/**
 * Request: crypto::ec_verify_recover_digest
 * @next PublicKey
 */
message EcVerifyRecoverDigest {
    required EcCurve curve = 1;
    required bytes public_key = 2;
    required bytes signature = 3;
    required bytes digest = 4;
}

/**
 * Request: crypto::ec_recover_pubkey
 * @next PublicKey
 */
message EcRecoverPubkey {
    required EcCurve curve = 1;
    required bytes signature = 2;
    required bytes digest = 3;
}

/**
 * Request: crypto::cosi_verify; `threshold` and `sigmask` must fit in a
 * byte, every public key must be 32 bytes
 * @next Success
 */
message CosiVerify {
    required uint32 threshold = 1;
    required bytes message = 2;
    repeated bytes public_keys = 3;
    required uint32 sigmask = 4;
    required bytes signature = 5;
}

/**
 * Response: the function succeeded
 * @end
 */
message Success {}

/**
 * Request: crypto::cosi_combine_publickeys; every public key must be 32 bytes
 * @next PublicKey
 */
message CosiCombinePublicKeys {
    repeated bytes public_keys = 1;
}

/**
 * Request: crypto::base58_encode
 * @next Base58
 */
message Base58Encode {
    required bytes data = 1;
}

/**
 * Request: crypto::base58_decode
 * @next Data
 */
message Base58Decode {
    required string encoded = 1;
}

/**
 * Request: crypto::base58check_encode
 * @next Base58
 */
message Base58CheckEncode {
    required bytes data = 1;
}

/**
 * Request: crypto::base58check_decode
 * @next Data
 */
message Base58CheckDecode {
    required string encoded = 1;
}

/**
 * Response: a base58 string
 * @end
 */
message Base58 {
    required string encoded = 1;
}

/**
 * Response: decoded bytes
 * @end
 */
message Data {
    required bytes data = 1;
}

/**
 * One request per modui layout. Each mirrors its layout's parameters one to
 * one, so the host drives the library through the same surface an app uses.
 * `br` is the step name the host sees for that screen. The app answers with
 * a UiResult.
 */

enum Commitment {
    Step = 0;
    Final = 1;
}

enum ValueKind {
    Text = 0;
    Address = 1;
}

// Prefixed because enum values share the package's namespace (`Success` is
// also a message); prost and the Python generator both strip the prefix.
enum Severity {
    Severity_Info = 0;
    Severity_Success = 1;
    Severity_Done = 2;
    Severity_Warning = 3;
    Severity_Danger = 4;
}

message Property {
    required string key = 1;
    required string value = 2;
    optional bool mono = 3 [default = false];
}

/**
 * Something the person can look at from the layout's menu.
 */
message ExtraItem {
    required string label = 1;
    repeated Property props = 2;
}

/**
 * Request: modui::confirm_action
 * @next UiResult
 */
message ConfirmAction {
    required string title = 1;
    required string action = 2;
    optional string description = 3;
    optional string subtitle = 4;
    optional Commitment commitment = 5 [default = Step];
    required string br = 6;
    repeated ExtraItem extras = 7;
}

/**
 * Request: modui::confirm_value
 * At most one of `footer_hint` and `footer_warning`.
 * @next UiResult
 */
message ConfirmValue {
    required string title = 1;
    required string value = 2;
    optional ValueKind kind = 3 [default = Text];
    optional string subtitle = 4;
    optional string description = 5;
    optional string footer_hint = 6;
    optional string footer_warning = 7;
    optional Commitment commitment = 8 [default = Step];
    required string br = 9;
    repeated ExtraItem extras = 10;
}

/**
 * Request: modui::confirm_data
 * @next UiResult
 */
message ConfirmData {
    required string title = 1;
    required bytes data = 2;
    optional string subtitle = 3;
    required string br = 4;
    repeated ExtraItem extras = 5;
}

/**
 * Request: modui::confirm_properties
 * @next UiResult
 */
message ConfirmProperties {
    required string title = 1;
    repeated Property props = 2;
    optional string subtitle = 3;
    optional Commitment commitment = 4 [default = Step];
    required string br = 5;
    repeated ExtraItem extras = 6;
}

/**
 * Request: modui::confirm_summary
 * An amount or a fee is shown only when both its label and its value are set.
 * @next UiResult
 */
message ConfirmSummary {
    required string title = 1;
    optional string amount_label = 2;
    optional string amount = 3;
    optional string fee_label = 4;
    optional string fee = 5;
    required string br = 6;
    repeated ExtraItem extras = 7;
}

/**
 * Request: modui::show_notice
 * @next UiResult
 */
message ShowNotice {
    optional Severity severity = 1 [default = Severity_Info];
    required string title = 2;
    required string content = 3;
    required string br = 4;
    repeated ExtraItem extras = 5;
    optional bool cancel = 6 [default = false];
}

/**
 * Request: modui::progress_with, paced by the host.
 * The progress stays up while the app asks for steps with `ProgressTick`; the
 * host answers each tick with `ProgressStep`, or with `ProgressEnd` to finish.
 * Without `total` the progress is indeterminate.
 * @next ProgressTick
 */
message ShowProgress {
    required string label = 1;
    optional uint32 total = 2;
}

/**
 * The app's question while a progress runs: what next?
 * @next ProgressStep
 * @next ProgressEnd
 */
message ProgressTick {}

/**
 * Report `units` more units of work done.
 * @next ProgressTick
 */
message ProgressStep {
    optional uint32 units = 1 [default = 1];
}

/**
 * The work is over; the progress goes away.
 * @next UiResult
 */
message ProgressEnd {}

/**
 * Response: how the layout ended, `Confirmed` or `Cancelled`. A progress
 * answers `Confirmed` once it has run.
 * @end
 */
message UiResult {
    enum Reply {
        Confirmed = 0;
        Cancelled = 1;
    }
    required Reply reply = 1;
}
