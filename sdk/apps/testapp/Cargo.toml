cargo-features = ["panic-immediate-abort"]

# A test-only app: exposes every modui block to the host, so the UI can be
# exercised by hand. Dev-signed only; it must never ship.

[package]
name = "testapp"
version = "0.1.0"
edition = "2024"

[package.metadata.trezor]
id = "testapp.trezor.io"
name = "Test app"
vendor = "SatoshiLabs"
stack-size = 16384
heap-size = 16384
# Host wire messages land here, so it must exceed the SDK default; see tron.
ipc-buffer-size = 4096
app-ring = 0
# Core requires one curve and at least one path; neither is used for keys.
curves = ["secp256k1"]
paths = ["m/44'/1'/account'/change/address_index/**"]

[dependencies]
trezor-app-sdk = { path = "../../crates/trezor-app-sdk" }
prost = { version = "0.14.1", default-features = false, features = ["derive"] }
ufmt = { version = "0.2.0", default-features = false }

[build-dependencies]
anyhow = "1.0.71"
trezor-app-build = { path = "../../crates/trezor-app-build" }

[features]
# --------------------------------------------------------------------------
# Model features
# --------------------------------------------------------------------------
model_t3t1 = []
model_t3w1 = []

# --------------------------------------------------------------------------
# Language features
# --------------------------------------------------------------------------
lang_en = []
lang_cs = []

# --------------------------------------------------------------------------
# Log level features
# --------------------------------------------------------------------------
log_level_error = ['trezor-app-sdk/log_level_error']
log_level_warn = ['trezor-app-sdk/log_level_warn']
log_level_info = ['trezor-app-sdk/log_level_info']
log_level_debug = ['trezor-app-sdk/log_level_debug']

# --------------------------------------------------------------------------
# Selectable features
# --------------------------------------------------------------------------
emulator = []
test = ["dev_keys", 'trezor-app-sdk/test', 'trezor-app-sdk/log_level_debug']
debug = ['trezor-app-sdk/debug']

# --------------------------------------------------------------------------
# Automatically derived features (do not enable from outside)
# --------------------------------------------------------------------------
dev_keys = []
