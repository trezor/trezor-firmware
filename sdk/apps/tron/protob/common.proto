syntax = "proto2";
package hw.trezor.common;

/**
 * Response: Success of the previous request
 * @end
 */
message Success {
    optional string message = 1 [default = ""];  // human readable description of action or request-specific payload
}

/**
 * Response: Failure of the previous request
 * @end
 */
message Failure {
    optional FailureType code = 1;  // computer-readable definition of the error state
    optional string message = 2;    // human-readable message of the error state
    enum FailureType {
        UnexpectedMessage = 1;
        ButtonExpected = 2;
        DataError = 3;
        ActionCancelled = 4;
        PinExpected = 5;
        PinCancelled = 6;
        PinInvalid = 7;
        InvalidSignature = 8;
        ProcessError = 9;
        NotEnoughFunds = 10;
        NotInitialized = 11;
        PinMismatch = 12;
        WipeCodeMismatch = 13;
        InvalidSession = 14;
        Busy = 15;
        ThpUnallocatedSession = 16;
        InvalidProtocol = 17;
        reserved 18;
        InProgress = 19;
        FirmwareError = 99;
    }
}

/**
 * Response: Device is waiting for HW button press.
 * @auxstart
 * @next ButtonAck
 */
message ButtonRequest {
    optional ButtonRequestType code = 1;  // enum identifier of the screen (deprecated)
    optional uint32 pages = 2;            // if the screen is paginated, number of pages

                                          // this existed briefly:
    // https://github.com/trezor/trezor-firmware/commit/1012ee8497b241e8ca559e386d936fa549bc0357
    reserved 3;

    optional string name = 4;  // name of the screen

    /**
     * Type of button request
     */
    enum ButtonRequestType {
        Other = 1;
        FeeOverThreshold = 2;
        ConfirmOutput = 3;
        ResetDevice = 4;
        ConfirmWord = 5;
        WipeDevice = 6;
        ProtectCall = 7;
        SignTx = 8;
        FirmwareCheck = 9;
        Address = 10;
        PublicKey = 11;
        MnemonicWordCount = 12;
        MnemonicInput = 13;
        _Deprecated_PassphraseType = 14 [deprecated = true];
        UnknownDerivationPath = 15;
        RecoveryHomepage = 16;
        Success = 17;
        Warning = 18;
        PassphraseEntry = 19;
        PinEntry = 20;
    }
}

/**
 * Structure representing BIP32 (hierarchical deterministic) node
 * Used for imports of private key into the device and exporting public key out of device
 * @embed
 */
message HDNodeType {
    required uint32 depth = 1;
    required uint32 fingerprint = 2;
    required uint32 child_num = 3;
    required bytes chain_code = 4;
    optional bytes private_key = 5;
    required bytes public_key = 6;
}
