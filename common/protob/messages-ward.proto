syntax = "proto2";
package hw.trezor.messages.ward;

// Sugar for easier handling in Java
option java_package = "com.satoshilabs.trezor.lib.protobuf";
option java_outer_classname = "TrezorMessageWard";

// WARD is a pull-oriented update round with a durable device-held pending edit:
//
//   WARDQueueUpdate   -- INTENT ONLY. The device shows the old->new change on a
//                    trusted screen; only if the user approves does it queue the
//                    intent under a fresh pending_id and return that id. NO proof is
//                    sent here, the root is NOT computed, and NO candidate counter
//                    is derived (strict model: counter_T is not a queue-time input).
//   WARDPerformUpdate -- Authorize the queued intent. The device DERIVES counter_T
//                    (= current attested counter + 1) here, PULLS the proof it needs
//                    on demand (WARDProofRequest naming pending_id), computes
//                    (root_T, mac_T) for counter_T, marks the edit COMMITTED, and
//                    returns the candidate. The durable counter is NOT yet advanced.
//   WARDConfirmedByWM -- verify the WM's Ed25519 signature over the exact
//                    device-derived (counter_T, mac_T), then install the root,
//                    advance the counter, and drop the queued edit.
//
// Multi-slot: several intents may be queued per wallet, each addressed by its own
// pending_id (bounded by the device storage cap). Commit stays serialized by
// counter (siblings stamped at the same counter_T at perform time go stale once
// one confirms).
// AuthDbInit / AuthDbSetRoot / AuthDbLookup remain in messages-authdb.proto.

/**
 * Request: Queue a leaf change as an unverified INTENT (pull model).
 *
 * This carries NO proof. The device shows the new_value on a trusted
 * screen and, only on user approval, stores the intent under a fresh pending_id
 * and returns it. No candidate counter is derived here (strict model: counter_T is
 * not a queue-time input). The candidate counter and root are derived later, at
 * WARDPerformUpdate, from a proof the device pulls itself.
 *
 * Supported operations (classified at perform time from the pulled proof):
 *   UPDATE  : new_value non-empty
 *   DELETE  : new_value empty
 *   INSERT  : new_value non-empty
 * The authoritative current state is the proof the device pulls at
 * WARDPerformUpdate.
 * @start
 * @next WARDQueueUpdateAck
 * @next Failure
 */
message WARDQueueUpdate {
    required bytes  address   = 1;  // identifier to update (== the AEAD-hidden identifier)
    required bytes  new_value = 2;  // plaintext new value the user confirms; empty means delete
    optional string app_id    = 3;  // domain; part of scope in entry_key = HMAC(K_index, app_id||0x00||key_type||0x00||device_id||identifier)
    optional string key_type  = 4;  // scope + entry_type (selects K_data); default "address"
    optional uint32 device_id = 5;  // scope device slot; 0 = global (§5)
}

/**
 * Response: the queued intent's handle. Returned only after the user approves the
 * change on the trusted screen; if the user rejects, a Failure is returned and no
 * intent is queued.
 * @end
 */
message WARDQueueUpdateAck {
    // No counter here (strict model): the candidate counter_T is first derived at
    // WARDPerformUpdate, not at queue time. Field 1 is reserved to preserve numbering.
    reserved 1;
    optional uint32 pending_id = 2;  // handle for this queued intent; addresses it in perform/confirm/discard
    optional bytes  wallet_id  = 3;  // RIPEMD160(SHA256(master pubkey)) BIP32 identifier, scopes the tree
}

/**
 * Request: Authorize a queued intent and compute its candidate.
 *
 * The device resolves pending_id to the queued intent, PULLS the proof package it
 * needs (it sends WARDProofRequest(address, pending_id) and the host answers with
 * WARDProofAck), verifies it against the authenticated root, computes (root_T,
 * mac_T) using the stored counter_T, and marks the edit COMMITTED. The counter is
 * still NOT advanced on the device.
 * @start
 * @next WARDProofRequest
 * @next WARDPerformUpdateAck
 * @next Failure
 */
message WARDPerformUpdate {
    optional uint32 pending_id = 1;  // which queued intent to perform; omit to target the single queued one
}

/**
 * Response: The authorized candidate triple.
 * @end
 */
message WARDPerformUpdateAck {
    required uint32 counter    = 1;  // candidate counter_T, derived on-device here (= current attested counter + 1)
    optional bytes  new_root   = 2;  // candidate root_T; absent if the tree becomes empty (DELETE to empty)
    optional bytes  mac        = 3;  // mac_T = HMAC(root_mac_key, wallet_id||counter_T||root_T); absent if empty
    optional bytes  wallet_id  = 4;  // RIPEMD160(SHA256(master pubkey)) BIP32 identifier, scopes the tree
    optional bytes  ward_id    = 5;  // SLIP21-derived WM-facing anchor; the host forwards it to the WM for /commit
    // The device is the encryptor; the host cannot compute the encrypted leaf, so
    // the device returns it here for the host to store keyed by entry_key. ct empty
    // = DELETE (remove the leaf at entry_key).
    optional bytes  entry_key  = 6;  // opaque 32B path the leaf is stored under
    optional string entry_type = 7;  // clear entry_type (selects K_data on decrypt)
    optional bytes  nonce      = 8;  // 12B AEAD nonce of the new leaf
    optional bytes  tag        = 9;  // 16B Poly1305 tag of the new leaf
    optional bytes  ct         = 10; // AEAD ciphertext of the new leaf (empty = delete)
}

/**
 * Request: Install the committed candidate after the WM has signed it.
 *
 * The device verifies wm_signature is a valid Ed25519 signature under the
 * provisioned WM public key over
 *     b"WARD FINAL v1" || ward_id || counter(4B BE) || mac
 * and asserts (counter, mac) equal the device-derived (counter_T, mac_T) of the
 * committed candidate and that counter is strictly greater than the stored
 * qm_last_counter (anti-rollback) -- the device is the counter authority; the WM
 * only co-signs. Only then does it install root_T, advance the counter and
 * qm_last_counter to counter_T, and drop the queued edit.
 * @start
 * @next WARDConfirmedByWMAck
 * @next Failure
 */
message WARDConfirmedByWM {
    required uint32 counter      = 1;  // counter_T; must equal the device-derived committed candidate
    optional bytes  mac          = 2;  // mac_T; must equal the committed candidate (absent iff the candidate is empty)
    required bytes  wm_signature = 3;  // WM Ed25519 sig over b"WARD FINAL v1"||ward_id||counter(4B BE)||mac
    optional uint32 pending_id   = 4;  // which committed candidate to install; omit to target the single queued one
}

/**
 * Response: The device's authenticated state after installation.
 * @end
 */
message WARDConfirmedByWMAck {
    required uint32 counter   = 1;  // counter after install (== counter_T)
    optional bytes  new_root  = 2;  // installed root; absent if the tree is now empty
    optional bytes  wallet_id = 3;  // RIPEMD160(SHA256(master pubkey)) BIP32 identifier, scopes the tree
    optional bytes  root_mac  = 4;  // HMAC(root_mac_key, wallet_id||counter||new_root); absent if empty
}

// ===========================================================================
// Sync round (bootstrap / refresh): establish the device's authenticated state
// from the WM-attested (counter, mac) and the host-held root.
//
//   WARDSync              -- device mints a per-round nonce (anti-replay)
//   WARDIngestAttestation -- device verifies the WM's signed (counter, mac)
//   WARDListPendingEdits  -- device reports its queued pending-edit addresses
//   WARDReconcile         -- device adopts the host root after checking it
//                            against the attested mac
// ===========================================================================

/**
 * Request: Begin a sync round. The device mints and stores a fresh nonce.
 * @start
 * @next WARDSyncAck
 * @next Failure
 */
message WARDSync {
}

/**
 * Response: the device-minted nonce (echoed back in the WM attestation).
 * @end
 */
message WARDSyncAck {
    required bytes  nonce     = 1;  // per-round anti-replay value the WM attestation must echo
    required uint32 version   = 2;  // WARD protocol version
    optional bytes  wallet_id = 3;  // RIPEMD160(SHA256(master pubkey)) BIP32 identifier, scopes the tree
    optional bytes  ward_id   = 4;  // SLIP21-derived WM-facing anchor; the host forwards it to the WM for /attest
}

/**
 * Request: Deliver the WM's freshness attestation for this wallet.
 *
 * The device verifies wm_signature is a valid Ed25519 signature under the
 * provisioned WM/QM public key over
 *     b"WARD ATTEST v1" || version(1B) || nonce || ward_id || counter(4B BE) || mac
 * where nonce is the one minted at WARDSync. It also asserts
 * counter >= counter_loc (anti-rollback), then records (counter, mac) as the
 * attested checkpoint for this round.
 * @start
 * @next WARDIngestAttestationAck
 * @next Failure
 */
message WARDIngestAttestation {
    required uint32 counter      = 1;  // counter_ext the WM claims is current
    optional bytes  mac          = 2;  // mac_ext = MAC(mac_key, root||counter_ext); absent if the tree is empty
    required bytes  wm_signature = 3;  // Ed25519 sig over the attestation preimage (see above)
}

/**
 * Response: acknowledgement of the accepted attestation.
 * @end
 */
message WARDIngestAttestationAck {
    required uint32 counter   = 1;  // accepted counter_ext
    optional bytes  wallet_id = 2;  // RIPEMD160(SHA256(master pubkey)) BIP32 identifier, scopes the tree
}

/**
 * Request: Ask the device for the addresses currently in its pending-edit queue
 * and their pending_ids (so Suite can fetch/build the corresponding entries).
 * @start
 * @next WARDListPendingEditsAck
 * @next Failure
 */
message WARDListPendingEdits {
}

/**
 * Response: the queued pending-edit addresses.
 * @end
 */
message WARDListPendingEditsAck {
    repeated bytes  addresses   = 1;  // addresses of the currently queued pending edits
    optional bytes  wallet_id   = 2;  // compatibility-only; callers should not depend on list_pending as the wallet_id source
    repeated uint32 pending_ids = 3;  // parallel to addresses: the pending_id of each queued candidate
    optional bytes  ward_id     = 4;  // SLIP21-derived WM-facing anchor; hosts use it to resolve wardId up front
}

/**
 * Request: Adopt the host-supplied root as the device's authenticated state.
 *
 * The device asserts MAC(mac_key, root || counter_ext) == the mac attested at
 * WARDIngestAttestation (binding the data plane to the state plane), then installs
 * (root, counter_ext) and advances the anti-rollback ceiling. `root` is absent for
 * an empty tree (the attested mac is then all-zero). Requires a prior
 * WARDIngestAttestation in the same round.
 * @start
 * @next WARDReconcileAck
 * @next Failure
 */
message WARDReconcile {
    optional bytes root = 1;  // the current authenticated root; absent for an empty tree
}

/**
 * Response: the device's authenticated state after adopting the root.
 * @end
 */
message WARDReconcileAck {
    required uint32 counter   = 1;  // installed counter (== attested counter_ext)
    optional bytes  new_root  = 2;  // installed root; absent if the tree is empty
    optional bytes  wallet_id = 3;  // RIPEMD160(SHA256(master pubkey)) BIP32 identifier, scopes the tree
    optional bytes  root_mac  = 4;  // HMAC(root_mac_key, wallet_id||counter||new_root); absent if empty
}

/**
 * Request: Verify a Merkle Patricia Trie proof for a (address, value) pair
 * against the device's authenticated root (formerly AuthDbLookup).
 *
 * Membership proof (witness_address absent): verify (address, value) is present.
 * Non-membership proof (witness_address present): verify address is absent via a
 * witness leaf on address's path. Empty proof + no witness = empty tree.
 * @start
 * @next WARDLookupAck
 * @next Failure
 */
message WARDLookup {
    required bytes  address            = 1;  // identifier; device forms entry_key = HMAC(K_index, app_id||0x00||key_type||0x00||device_id||identifier)
    reserved 2;                              // was plaintext value; membership now carries (nonce,tag,ct)
    repeated bytes  proof              = 3;  // sibling hashes, leaf-to-root order (33 bytes each)
    optional bytes  witness_entry_key  = 4;  // non-membership: witness leaf entry_key (32B; reveals no plaintext)
    optional bytes  witness_commit     = 5;  // non-membership: witness leaf commit = sha256(0x02||nonce||tag||len32(ct)||ct)
    reserved 6;                              // was counter; C_leaf now lives inside ct
    reserved 7;                              // was witness_counter
    optional string app_id             = 8;  // domain; part of scope
    optional string key_type           = 9;  // scope + entry_type (selects K_data); default "address"
    optional uint32 device_id          = 10; // scope device slot; 0 = global
    optional bytes  nonce              = 11; // membership: 12B AEAD nonce
    optional bytes  tag                = 12; // membership: 16B Poly1305 tag
    optional bytes  ct                 = 13; // membership: AEAD ciphertext (empty = delete/absent)
}

/**
 * Response: verification result together with the current counter.
 * @end
 */
message WARDLookupAck {
    required bool   valid      = 1;  // true if the proof is valid against the stored root
    required uint32 counter    = 2;  // current global counter
    optional bool   membership = 3;  // true = membership proof, false = non-membership
    optional bytes  wallet_id  = 4;  // RIPEMD160(SHA256(master pubkey)) BIP32 identifier, scopes the tree
    optional bytes  ward_id    = 5;  // SLIP21-derived WM-facing anchor; scopes host-side WARD storage
}

/**
 * Request: DEBUG-ONLY unauthenticated root injection, for tests to seed a root
 * without the full attest+merge sequence. Rejected on production firmware.
 * @start
 * @next WARDDebugSetRootAck
 * @next Failure
 */
message WARDDebugSetRoot {
    required bytes root = 1;  // 32-byte root to install (increments the counter by 1)
}

/**
 * Response: the device state after the debug injection.
 * @end
 */
message WARDDebugSetRootAck {
    required uint32 counter   = 1;  // counter after install
    optional bytes  new_root  = 2;  // installed root
    optional bytes  wallet_id = 3;  // RIPEMD160(SHA256(master pubkey)) BIP32 identifier, scopes the tree
    optional bytes  root_mac  = 4;  // HMAC(root_mac_key, wallet_id||counter||new_root)
}

/**
 * Request: DEVICE -> HOST. Emitted mid-workflow when the device needs a WARD proof
 * on demand instead of having the host push it up-front. Two callers:
 *   - display/lookup: an on-device app (Bitcoin / Ethereum getAddress,
 *     DisplayAddress, ...) about to display an address; pending_id is absent.
 *   - update: WARDPerformUpdate resolving a queued intent; pending_id names it, so
 *     the host serves the proof for exactly that queued update.
 * The host answers with the WARD entry + proof it holds (WARDProofAck); the device
 * verifies it against its own authenticated root before trusting/using the value.
 * @next WARDProofAck
 */
message WARDProofRequest {
    reserved 1;                      // was plaintext address; the device now sends the opaque entry_key path
    optional uint32 pending_id = 2;  // set during WARDPerformUpdate: the queued intent this proof is for
    reserved 3;                      // was app_id; now folded into entry_key, so the host learns no domain either
    required bytes  entry_key  = 4;  // 32B HMAC path the device computed locally; the host serves the proof for it
}

/**
 * Response: HOST -> DEVICE. The WARD entry the host holds for the requested
 * address, plus the proof binding it to the device's authenticated root.
 *
 *   membership     : set value + counter (+ proof); leave the witness_* fields empty.
 *   non-membership : leave value empty; set proof + witness_address / witness_value /
 *                    witness_counter (empty tree: leave everything empty).
 * @end
 */
message WARDProofAck {
    reserved 1;                              // was plaintext value; membership now carries (nonce,tag,ct)
    repeated bytes  proof             = 2;   // sibling hashes, leaf-to-root order (33 bytes each)
    reserved 3;                              // was counter; C_leaf now lives inside ct
    optional bytes  witness_entry_key = 4;   // non-membership: witness leaf entry_key (32B; reveals no plaintext)
    optional bytes  witness_commit    = 5;   // non-membership: witness leaf commit = sha256(0x02||nonce||tag||len32(ct)||ct)
    reserved 6;                              // was witness_counter
    reserved 7;                              // was app_id; the host no longer knows the domain (opaque entry_key)
    optional string entry_type        = 8;   // clear; selects K_data(entry_type) for decrypt
    optional bytes  nonce             = 9;   // membership: 12B AEAD nonce
    optional bytes  tag               = 10;  // membership: 16B Poly1305 tag
    optional bytes  ct                = 11;  // membership: AEAD ciphertext (empty tree: leave all empty)
}

/**
 * Request: PUSH key export. The host retrieves the keys it needs to serve the
 * push flow itself: K_index (to compute entry_key = HMAC(K_index, scope||identifier)
 * from a plaintext identifier) and K_data(key_type) (to encrypt/decrypt values).
 * This is a deliberate, gated downgrade of the "Suite holds no keys" property for
 * the push-capable entry types only; K_sig is NEVER exported. The host is expected
 * to hold the returned keys in memory only.
 * @start
 * @next WARDExportKeysAck
 * @next Failure
 */
message WARDExportKeys {
    optional string key_type = 1;  // entry_type whose K_data to export; default "address"
}

/**
 * Response: the exported keys for the requested key_type.
 * @end
 */
message WARDExportKeysAck {
    optional bytes  k_index  = 1;  // HMAC-SHA256 key deriving every entry_key path
    optional bytes  k_data   = 2;  // ChaCha20-Poly1305 key for the requested key_type
    optional string key_type = 3;  // echoes the requested key_type
}

/**
 * Request: abandon queued pending edit(s) without finalizing them.
 *
 * With pending_id, drops just that candidate; without it, drops EVERY candidate
 * queued for the wallet. If a candidate can never be finalized (e.g. the WM will
 * not sign it), this lets the host explicitly discard it and free a queue slot.
 * Scoped to the caller's wallet; candidates belonging to a different (hidden)
 * wallet are left untouched. Idempotent: discarding when nothing matches succeeds
 * with no discarded_address.
 * @start
 * @next WARDDiscardPendingAck
 * @next Failure
 */
message WARDDiscardPending {
    optional uint32 pending_id = 1;  // which queued candidate to drop; omit to drop ALL of the wallet's candidates
}

/**
 * Response: the outcome of the discard.
 * @end
 */
message WARDDiscardPendingAck {
    optional bytes  discarded_address = 1;  // address whose edit was discarded; absent if none matched or in drop-all mode
    optional bytes  wallet_id         = 2;  // RIPEMD160(SHA256(master pubkey)) BIP32 identifier
    optional uint32 pending_id        = 3;  // echoes the requested pending_id; absent in drop-all mode
}

/**
 * One device-encrypted leaf produced by a batch commit, for the host to store
 * keyed by entry_key. ct empty = DELETE (remove the leaf at entry_key).
 */
message WARDBatchLeaf {
    required bytes  entry_key  = 1;  // opaque 32B trie path the leaf is stored under
    optional string entry_type = 2;  // clear entry_type (selects K_data on decrypt)
    optional bytes  nonce      = 3;  // 12B AEAD nonce
    optional bytes  tag        = 4;  // 16B Poly1305 tag
    optional bytes  ct         = 5;  // AEAD ciphertext (empty = delete)
}

/**
 * Request: commit several queued intents as ONE atomic root transition (batch
 * update). The device pulls a pre-state proof for each intent (one WARDProofRequest
 * per entry_key), folds them into a single successor root, stamps every leaf at the
 * one transition counter (counter += 1 for the whole batch), and authenticates the
 * transition with head_mac + AuthCommit. Order-independent; a duplicate entry_key in
 * the set is rejected.
 * @start
 * @next WARDPerformBatchAck
 * @next WARDProofRequest
 * @next Failure
 */
message WARDPerformBatch {
    repeated uint32 pending_ids = 1;  // queued intents to commit together (>=1; no duplicate entry_key)
}

/**
 * Response: the authenticated batch candidate. counter is to_counter = from_counter
 * + 1 (the whole batch is one transition). The host publishes each leaf to the
 * payload store (parent_hash=from_root, target_hash=new_root) and forwards
 * (counter, mac, ward_id) to the WM for co-signing.
 * @end
 */
message WARDPerformBatchAck {
    required uint32 counter      = 1;  // to_counter (= from_counter + 1)
    optional bytes  from_root    = 2;  // root the batch transitions FROM (empty-tree sentinel if empty)
    optional bytes  new_root     = 3;  // to_root; absent if the tree becomes empty
    optional bytes  mac          = 4;  // root MAC the WM co-signs; absent if empty
    optional bytes  wallet_id    = 5;  // RIPEMD160(SHA256(master pubkey)) BIP32 identifier
    optional bytes  ward_id      = 6;  // SLIP21 WM-facing anchor; host forwards to the WM
    required bytes  head_mac     = 7;  // MAC(K_head, TAG_HEAD||ward_id||to_counter||to_root)
    required bytes  auth_commit  = 8;  // MAC(K_auth, TAG_COMMIT||ward_id||from_c||from_root||to_c||to_root)
    optional bytes  sig_commit   = 9;  // Ed25519(K_sig, <AuthCommit preimage>); present only when WARD_KSIG is on
    repeated WARDBatchLeaf leaves = 10; // device-encrypted leaves for the host to store
}

/**
 * Request: install a committed batch after the WM co-signs its head. The device
 * re-verifies the WM signature and the stored AuthCommit, checks the counter is
 * ahead of its floor, then installs (to_counter, to_root) and drops the whole
 * pending set. The single counter-advancing step for a batch.
 * @start
 * @next WARDConfirmBatchByWMAck
 * @next Failure
 */
message WARDConfirmBatchByWM {
    required uint32 counter      = 1;  // to_counter; must equal the committed batch
    optional bytes  mac          = 2;  // root MAC; must equal the committed batch (absent iff empty)
    required bytes  wm_signature = 3;  // WM Ed25519 over b"WARD FINAL v1"||ward_id||counter(4B BE)||mac
}

/**
 * Response: the installed batch head.
 * @end
 */
message WARDConfirmBatchByWMAck {
    required uint32 counter   = 1;  // counter after install (== to_counter)
    optional bytes  new_root  = 2;  // installed root; absent if the tree is now empty
    optional bytes  wallet_id = 3;  // RIPEMD160(SHA256(master pubkey)) BIP32 identifier
    optional bytes  root_mac  = 4;  // root MAC; absent if empty
}
