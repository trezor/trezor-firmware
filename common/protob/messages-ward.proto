syntax = "proto2";
package hw.trezor.messages.ward;

// Sugar for easier handling in Java
option java_outer_classname = "TrezorMessageWard";
option java_package = "com.satoshilabs.trezor.lib.protobuf";

/**
 * WARD: SEALED LEAF, PULL-ONLY, KEYED PATH.
 *
 * The device stores no entries. When it needs one it PULLS it from the host
 * mid-workflow: it emits WardEntryRequest naming what it wants, the host answers
 * WardEntryAck, and the device displays the value.
 *
 * What it names is an opaque 32-byte keyed path (see WardEntryRequest), never the
 * identifier. The host's store is therefore keyed by HMAC output, so persisted host
 * state -- and any backup or sync derived from it -- contains no identifiers.
 *
 * The requests below still carry app_id and identifier, because the host has to say
 * which entry it wants operated on and the device needs both to derive the path. So
 * this does NOT hide from the host what the host itself just asked about; the win is
 * over the host's STORAGE. Hiding the request too arrives when the caller is an
 * on-device app rather than the host.
 *
 * Reads (WardGetEntry) and writes (WardSetEntry, WardDeleteEntry) both hang off that
 * one pull. On a write the device pulls the CURRENT value first, so it can show the
 * user what is about to be replaced or removed rather than only what is arriving.
 *
 * The stored unit is a two-part LEAF (see WardLeafIdentity / WardLeafContent), which the DEVICE
 * builds and returns (WardLeafAck); the host stores it verbatim and applies the change
 * to its own store. The device still keeps nothing of its own.
 *
 * Both leaf parts are SEALED under device-only keys, with the AAD binding each part to
 * its path, so the host cannot forge a leaf, read one, or move one between paths.
 *
 * It can still return an OLDER sealed leaf for a path, or claim it holds none at all.
 * Neither is detectable without a proof against an attested root, so what reaches a
 * screen is authentic but not proven current, and the screens say exactly that. The
 * warning is narrower than it was before sealing, not gone.
 *
 * REQUEST fields are `optional` deliberately. A proto2 `required` field that a caller forgets
 * to set is an encode-time failure in every binding, which has bitten this protocol before;
 * the handler validates instead.
 *
 * The exception is `entry_key` on the acks, which is `required`. The argument above is about
 * fields a HOST fills in; entry_key is filled in by the DEVICE, which derives it and always
 * has it. It is also the only way a host can learn the path a leaf belongs at -- an ack
 * without it is unusable, so a decode failure is the honest outcome rather than a record
 * stored under nothing.
 *
 * THE OFFLINE QUEUE HAS ITS OWN REQUESTS. WardQueueSetEntry / WardQueueDeleteEntry /
 * WardQueueGetEntry, each with its own ack. They are not modes of the messages above: a
 * request whose meaning depends on whether the session happens to be synced is one a host
 * cannot reason about, and it made "did my change apply?" a question about hidden state. The
 * online requests now REFUSE when there is no synced session and say which message to use.
 *
 * THE QUEUE IS BACKUPABLE, and that is what its get/set pair is really for. A queued change lives
 * in one device's flash and nowhere else, so WardQueueGetEntry exports it WITH A MAC over
 * everything the device would need to write it back, and WardQueueSetEntry accepts it again only
 * if that MAC verifies. The blob is plaintext -- a backup a host can hold and inspect -- so the
 * MAC is what stands between "a change this wallet queued" and "bytes a host made up".
 */

/**
 * Request: show the WARD entry the HOST holds for (app_id, identifier).
 * The device pulls the value and displays it; it keeps nothing.
 * @start
 * @next Success
 * @next Failure
 */
message WardGetEntry {
    optional string app_id     = 1;  // domain that owns the entry; namespaces the lookup
    optional bytes  identifier = 2;  // key within that domain (e.g. an address)
}

/**
 * Request: create or replace the WARD entry the HOST holds for (app_id, identifier).
 *
 * The device pulls the current value first, so an ADD and an OVERWRITE are different
 * screens and the user sees the value being replaced. The device returns the leaf it
 * built (WardLeafAck) and the host stores it.
 *
 * REQUIRES A SYNCED SESSION and refuses without one. It used to queue the change silently,
 * which made one request mean two different things depending on state the host cannot see --
 * and made "did this apply?" unanswerable from the request alone. Queueing is now asked for by
 * name: WardQueueSetEntry.
 * @start
 * @next WardLeafAck
 * @next Failure
 */
message WardSetEntry {
    optional string app_id     = 1;  // domain that owns the entry
    optional bytes  identifier = 2;  // key within that domain
    optional bytes  value      = 3;  // the new value; empty is allowed, absent is not
}

/**
 * Request: delete the WARD entry the HOST holds for (app_id, identifier).
 *
 * Deliberately a SEPARATE message rather than a `delete` flag on WardSetEntry. A flag
 * is silently droppable -- a host that rebuilds its params field-by-field and forgets
 * to forward it turns every delete into a write of the wrong value, which is exactly
 * the bug this protocol hit before. A distinct message cannot degrade that way.
 *
 * The device pulls the entry first so it can show what is being removed, and refuses
 * if the host reports no such entry -- there is then nothing to confirm.
 * @start
 * @next WardLeafAck
 * @next Failure
 */
message WardDeleteEntry {
    optional string app_id     = 1;  // domain that owns the entry
    optional bytes  identifier = 2;  // key within that domain
}

/**
 * Response: device -> host, sent mid-workflow. Names the entry the device wants, as an
 * OPAQUE KEYED PATH. Emitted by all three requests above; the host must reply with
 * WardEntryAck.
 *
 * The device derives entry_key itself and NEVER accepts one from the host, so the host
 * cannot steer a read or a write at a slot of its choosing:
 *
 *   K_path    = SLIP21(seed, ["ward", "K_path"])
 *   scope     = app_id || 0x00 || key_type || 0x00 || device_id(1B)
 *   entry_key = HMAC-SHA256(K_path, scope || identifier)
 *
 * K_path is passphrase-dependent, so every hidden wallet has its own key space and the
 * same identifier maps to different paths under different passphrases.
 */
message WardEntryRequest {
    reserved 1, 2;                  // were app_id, identifier -- now folded into entry_key
    optional bytes entry_key = 3;   // 32B keyed path; the host serves by this alone
}

/**
 * A leaf is TWO independently encoded parts, each a self-describing "manual oneof":
 * trezor's protobuf codegen has no `oneof`, so mutual exclusivity is a code invariant
 * and `encoding` selects which submessage is meaningful. (Same pattern as
 * PaymentRequestMemo in messages-common.proto.)
 *
 *   WardLeafIdentity  the keyed-path preimage: identifier + app_id + device_id
 *   WardLeafContent   C_leaf + value
 *
 * `key_type` is ALWAYS CLEAR -- it selects both of the keys that seal the parts, so it
 * cannot itself be sealed -- and lives on WardLeafIdentity so it is not repeated per part.
 *
 *   part(p) = encoding(1B)||len8(nonce)||nonce||len8(tag)||tag||len32(body)||body
 *
 * Each part's encoding byte sits inside that framing, so a sealed and an unsealed part
 * can never collide.
 *
 * THE DEVICE PRODUCES THE LEAF and the host stores it verbatim. This is not a convention
 * the host is asked to respect -- it holds neither K_ident nor K_data, so it cannot
 * produce a part at all.
 *
 * An EMPTY part (empty body) means DELETED. Note this differs from an entry whose value
 * merely happens to be empty, which is a PRESENT part whose body carries a zero-length
 * value -- see WardEntryAck. Conflating the two would make empty-valued entries
 * indistinguishable from deleted ones, and so impossible to represent or to delete.
 */
message WardEncryptedLeaf {
    optional bytes nonce = 1;  // 12B AEAD nonce
    optional bytes tag   = 2;  // 16B Poly1305 tag
    optional bytes ct    = 3;  // AEAD ciphertext (empty = delete)
}
message WardPlaintextLeaf {
    optional bytes content = 1;  // C_leaf(4B)||len32(value)||value (empty = delete)
}
message WardLeafContent {
    optional uint32 encoding         = 1;  // 0 = encrypted (default), 1 = plaintext
    optional WardEncryptedLeaf encrypted = 2;  // set when encoding = 0
    optional WardPlaintextLeaf plaintext = 3;  // set when encoding = 1
}

message WardPlainIdentity {
    optional bytes  identifier = 1;  // the otherwise-hidden identifier, in the clear
    optional string app_id     = 2;  // domain that owns the entry
    optional uint32 device_id  = 3;  // scope device slot; 0 = global
}
message WardEncryptedIdentity {
    optional bytes nonce = 1;  // 12B AEAD nonce
    optional bytes tag   = 2;  // 16B Poly1305 tag
    optional bytes ct    = 3;  // AEAD over len16(identifier)||identifier||len8(app_id)||app_id||device_id(1B)
}
message WardLeafIdentity {
    optional uint32 encoding             = 1;  // 0 = encrypted (default), 1 = plaintext
    optional string key_type             = 2;  // ALWAYS CLEAR -- selects both leaf keys
    optional WardEncryptedIdentity encrypted = 3;  // set when encoding = 0
    optional WardPlainIdentity     plain     = 4;  // set when encoding = 1
}

/**
 * Request: host -> device. The leaf the host holds for the path the device just asked
 * about, exactly as the device once handed it over.
 *
 * BOTH FIELDS ABSENT means "no such entry". That is distinct from a leaf whose content
 * body carries a zero-length value, which is an entry that exists and whose value
 * happens to be empty.
 *
 * UNAUTHENTICATED: nothing here binds the leaf to the device or proves it is current.
 */
message WardEntryAck {
    reserved 1;                            // was a bare `value`; the unit is a leaf now
    optional WardLeafIdentity identity = 2;    // absent together with content = no such entry
    optional WardLeafContent  content  = 3;

    // Proof that this answer matches the tree the device already trusts. Elements are
    // 34 bytes each -- u16be(split_bit) || sibling(32B) -- in
    // LEAF-TO-ROOT order.
    //
    //   membership     : identity + content + proof
    //   non-membership : no identity/content; proof + witness_entry_key + witness_commit
    //   empty tree     : nothing at all
    //
    // Absence needs a witness because a binary trie has no "absent" node to point at:
    // the host exhibits the leaf that already occupies the path the requested key would
    // take. It travels as two hashes, so serving an absence proof reveals nothing about
    // the witness's own identifier or value.
    repeated bytes proof             = 4;
    optional bytes witness_entry_key = 5;
    optional bytes witness_commit    = 6;

    // 7-11 were the sibling witness a DELETE had to present: a branch decomposition or a
    // leaf's (entry_key, commit), so the device could re-derive a re-parented sibling at its
    // new depth. None of it is needed now that a node's hash does not commit to its depth --
    // the collapsing sibling promotes unchanged, whatever it is. Reserved rather than reused,
    // so a stale host cannot have an old field silently reinterpreted.
    reserved 7, 8, 9, 10, 11;
}


/**
 * Response: device -> host, ending a WardSetEntry or WardDeleteEntry.
 *
 * Carries the leaf the DEVICE built, because the host cannot build one itself once the
 * parts are sealed -- it has none of the keys. The host stores this verbatim under
 * entry_key; for a delete, both parts are empty and the host removes the record.
 *
 * The host has no other way to learn entry_key, so this is also how a newly created
 * entry acquires its key.
 *
 * ONLY FOR A LEAF THAT ENTERED THE TRIE. Every ack of this type reports a real transition of
 * the tree: a new or replaced leaf, or the empty-part leaf of a delete. Nothing that merely
 * touched the device's own queue is reported here -- those have their own messages, and keeping
 * them out is why this one can promise a leaf and a path at all.
 */
message WardLeafAck {
    required bytes        entry_key = 1;  // 32B keyed path this leaf belongs at; ALWAYS set
    optional WardLeafIdentity identity  = 2;
    optional WardLeafContent  content   = 3;  // empty part = the entry was deleted

    // The state this write produced. The DEVICE is the counter authority -- it derived
    // the new root and stamped the next counter on it -- and the host must publish this
    // pair to the WM so the WM's view matches. Until it does, the device is ahead of the
    // WM and its next sync will be REFUSED as a rollback: fail-closed, and recoverable by
    // publishing, which is the right way round compared with silently losing the write.
    optional uint32 counter = 4;
    optional bytes  mac     = 5;  // mac over (new root, counter); the WM signs it blind

    // Authorises THIS transition: HMAC(K_auth, tag || ward_id || from_counter ||
    // from_root || to_counter || to_root). The host stores it with the link -- it knows
    // both endpoints, having held the tree before and after -- so that another device of
    // this wallet can later verify the step without having witnessed it.
    optional bytes auth_commit = 6;

    // Ed25519 over exactly the bytes auth_commit MACs, under K_sig, verifiable against
    // ward_id (which IS that key's public half). Complementary, not a replacement: the MAC
    // is what another device of this wallet checks and remains the authority on
    // authenticity; this exists so the WM -- holding no secret of ours, and trusted for
    // freshness only -- can still tell a real device's transition from anyone else's.
    // Without it a WM that arbitrates ordering is a denial-of-service oracle.
    optional bytes auth_sig = 7;

    // 8 and 9 were `queued` and `remaining`, which only ever applied to the OFFLINE QUEUE.
    // They now live on WardQueueAck, which is a separate message precisely so that neither
    // field can appear on an ack that carries a real leaf. Reserved rather than reused, so a
    // stale host cannot have an old field silently reinterpreted.
    reserved 8, 9;
}

/**
 * THE OFFLINE QUEUE: three requests, three acks, no shared shapes.
 *
 * Everything below operates on the DEVICE'S OWN STORE and never on the trie. Nothing here
 * derives a root, stamps a counter or produces a leaf -- it cannot, because with no synced host
 * the device can neither pull the current value nor prove what state the tree is in. That is
 * exactly why these are separate messages rather than modes of WardSetEntry / WardDeleteEntry /
 * WardGetEntry: the answers have nothing in common with a leaf, and a host that could confuse
 * the two would store an entry made of nothing.
 *
 * A queued write reaches the tree later, sealed and re-derived, through WardFlushQueue.
 */

/**
 * Request: hold a write on the device until a synced host can publish it -- or RESTORE one that
 * was held before, from a backup the device itself authenticated.
 *
 * TWO SHAPES, told apart by `mac`, and the discriminator is cryptographic rather than declared:
 *
 *   mac ABSENT   a fresh intent. The device shows what is being queued -- and, if it already
 *                holds a copy, what that copy says -- and stores it only after the user confirms.
 *                The screen must read QUEUED rather than done: a confirmation that looks like
 *                "applied" when nothing has been applied leaves the user with no reason to think
 *                anything is outstanding.
 *
 *   mac PRESENT  a restore. The fields must be exactly what WardQueueGetAck once exported, and
 *                the device recomputes the MAC over all of them before showing anything. Material
 *                that fails to authenticate never reaches a screen: a confirmation for
 *                unauthenticated bytes teaches the user that the screen means nothing.
 *
 * A restore therefore carries the fields the fresh path derives or defaults -- `counter` and
 * `key_type` -- because both are inside the MAC and neither can be re-guessed on the way in.
 *
 * NO REPLAY BOUND, deliberately and for now: a correctly-MAC'd intent is accepted whenever it
 * arrives, so a host can re-offer a change the user discarded or one already published. `counter`
 * is carried and MAC'd, so bounding it later is a handler change and not a wire change.
 * @start
 * @next WardQueueSetAck
 * @next Failure
 */
message WardQueueSetEntry {
    optional string app_id     = 1;  // domain that owns the entry
    optional bytes  identifier = 2;  // key within that domain
    optional bytes  value      = 3;  // the value to queue; empty is allowed, absent is not

    // RESTORE ONLY, and all three are meaningless without the first.
    optional bytes  mac        = 4;  // 32B intent MAC, exactly as WardQueueGetAck returned it
    optional uint32 counter    = 5;  // the counter the record carried when it was exported
    optional string key_type   = 6;  // the key space the entry belongs to; MAC'd, so not defaulted
}

/**
 * Response: the change is held on the device.
 *
 * entry_key AND NOTHING ELSE. There is no counter, no mac and no leaf because none of them
 * exists yet -- and the message type, not a flag, is what tells the host so. The path is still
 * worth returning: it is the key the host's store is organised by, and the host has no other way
 * to learn it.
 * @end
 */
message WardQueueSetAck {
    required bytes entry_key = 1;  // 32B keyed path the queued change is for
}

/**
 * Request: DISCARD a queued change. Removes it from the device's queue; the WARD entry itself is
 * untouched, and WardDeleteEntry remains the only way to remove one from the tree.
 *
 * PENDING RECORDS ONLY. A pinned read at the same path is reported as `missing` and left alone --
 * "stop keeping this here" is a different question from "do not publish this", and one
 * confirmation cannot honestly stand for both. WardEraseCachedEntry is the pinned-copy path.
 * @start
 * @next WardQueueDeleteAck
 * @next Failure
 */
message WardQueueDeleteEntry {
    optional string app_id     = 1;  // domain that owns the entry
    optional bytes  identifier = 2;  // key within that domain
}

/**
 * Response: what happened to the queued change.
 *
 * `missing` is reported rather than raised because "there was nothing queued" is an ANSWER, not
 * a failure -- a host draining its own view of the queue will legitimately ask about a path the
 * device has already published. No screen is shown in that case either: a hold-to-confirm that
 * always means "nothing happened" is one that gets approved without being read.
 * @end
 */
message WardQueueDeleteAck {
    required bytes entry_key = 1;  // 32B keyed path asked about
    optional bool  missing   = 2;  // set when no queued change was held at this path
}

/**
 * Request: EXPORT what the DEVICE holds for (app_id, identifier), so the host can back it up.
 *
 * Serves from the device's own store: a change queued but not yet published, or a copy pinned by
 * WardPinCachedEntry. It never pulls, so the host is not asked for anything and cannot influence
 * what comes back.
 *
 * BACKUP IS WHY THIS EXISTS. A queued change lives in one device's flash and nowhere else, so a
 * lost or wiped device loses a change the user confirmed. Exporting it lets the host hold it and
 * hand it back through WardQueueSetEntry -- and the `mac` below is what makes handing it back safe
 * to accept.
 *
 * ONE RECORD, NAMED. The host must know (app_id, identifier) to ask, so a backup covers only what
 * the host can name: a change queued by an ON-DEVICE app is not exportable this way, and nothing
 * reports that gap. Closing it needs an iterator like WardFlushQueue's, which is not built.
 *
 * The user confirms the export, because it is the only notice they get that a value the device was
 * holding for itself is leaving.
 * @start
 * @next WardQueueGetAck
 * @next Failure
 */
message WardQueueGetEntry {
    optional string app_id     = 1;  // domain that owns the entry
    optional bytes  identifier = 2;  // key within that domain
}

/**
 * Response: the record, and -- for a queued change -- the MAC that lets it come back.
 *
 * IN THE CLEAR. app_id, identifier and value are returned as stored. This is an exception to the
 * rule the keyed path buys elsewhere: the host's LEAF store contains no identifiers, but a queue
 * backup contains both identifier and value, including for a change queued by an on-device app
 * that the host never saw. Accepted deliberately, so that a backup is something a host can hold,
 * inspect and restore without holding any device key.
 *
 * `mac` IS THE POINT. It authenticates (entry_key, op, counter, key_type, app_id, identifier,
 * value) under K_auth -- see `cas.intent_preimage` -- so a restore can be checked against what
 * this wallet actually queued rather than trusted because a host says so. Present ONLY for a
 * pending record: a pinned copy is not an intent, there is nothing to re-queue, and returning a
 * MAC for one would invite a restore that means nothing.
 *
 * A true `mac` does NOT mean the intent should be queued again now -- it carries no freshness. See
 * the replay note on WardQueueSetEntry.
 *
 * `stale` is DERIVED, not stored: it compares the counter the record was authenticated at with
 * the counter the device trusts now, so advancing the head never has to touch a record.
 * @end
 */
message WardQueueGetAck {
    required bytes  entry_key = 1;  // 32B keyed path asked about
    optional bool   missing   = 2;  // nothing kept for this path; connect to read it
    optional bool   pending   = 3;  // a queued change -- what this device believes, not what WARD holds
    optional bool   unreadable = 4; // stored but not decodable by this build; NOT the same as missing
    optional bool   stale     = 5;  // authenticated at a counter older than the trusted one
    optional uint32 counter   = 6;  // the counter the record was authenticated at; 0 = never

    // The record itself, absent when nothing readable was found. Hand all of these back
    // UNCHANGED with the mac to restore the intent; every one of them is MAC'd.
    optional string key_type   = 7;
    optional string app_id     = 8;
    optional bytes  identifier = 9;
    optional bytes  value      = 10;
    optional bytes  mac        = 11;  // 32B intent MAC; pending records only
}

/**
 * Response: device -> host, ending a WardFlushQueue.
 *
 * A published queued change IS an ordinary leaf -- sealed here, re-derived against proven
 * current state -- so this carries exactly what WardLeafAck carries, plus the one thing only a
 * drain needs. It is a separate message so that `remaining` cannot appear on an ack for a write
 * the host made directly, where it would mean nothing.
 *
 * With an EMPTY QUEUE only `remaining = 0` is set: there is no leaf and no path, because there
 * was no change to publish.
 * @end
 */
message WardFlushQueueAck {
    optional bytes            entry_key = 1;  // absent when the queue was already empty
    optional WardLeafIdentity identity  = 2;
    optional WardLeafContent  content   = 3;

    // The state this publication claimed, as on WardLeafAck: the device derived the new root and
    // stamped the next counter, and the host must publish the pair to the WM.
    optional uint32 counter = 4;
    optional bytes  mac     = 5;  // mac over (new root, counter); the WM signs it blind

    optional bytes auth_commit = 6;  // authorises this transition; see WardLeafAck.auth_commit
    optional bytes auth_sig    = 7;  // Ed25519 over the same preimage; see WardLeafAck.auth_sig

    // How many queued changes remain after this one. The host loops until it reads zero. One
    // intent per round-trip, so a failure costs one step rather than a batch -- see the
    // atomicity note in the device's storage/ward.py.
    required uint32 remaining = 8;
}

/**
 * One authorised step from one root to the next.
 *
 * `auth_commit` is a MAC under a seed-derived key, so only a device of this wallet could
 * have produced it -- and only such a device can check it. The host holds these without
 * being able to forge or read them.
 *
 * Absent roots mean the empty tree.
 */
message WardChainLink {
    optional uint32 from_counter = 1;
    optional bytes  from_root    = 2;
    optional uint32 to_counter   = 3;
    optional bytes  to_root      = 4;
    optional bytes  auth_commit  = 5;
}

/**
 * Request: adopt the attested head by proving it DESCENDS from the head this device
 * already holds, rather than by being handed a root and told to trust it.
 *
 * Runs after WardIngestAttestation, in place of WardReconcile. The device folds the links
 * from its own head forward, checking at each step that the counter and root are
 * contiguous, that the counter advances by exactly one, and that the step was authorised.
 * The chain must terminate at the attested counter, and its final root must reproduce the
 * attested mac.
 *
 * This is what a device needs when it has fallen more than one step behind -- another
 * device of the wallet wrote while it was away. Reconcile alone would accept the new head
 * on the WM's word; this additionally establishes that every intervening step was made by
 * a device holding the seed, and that no step was skipped, which is how a fork would
 * otherwise stay invisible.
 *
 * Descent is not currency: the WM attestation supplies that, and the two are joined by
 * requiring the chain to end exactly where the attestation says.
 * @start
 * @next WardVerifyChainAck
 * @next Failure
 */
message WardVerifyChain {
    repeated WardChainLink links = 1;  // ordered, starting at the device's current head
}

/**
 * Response: the head the device adopted.
 * @end
 */
message WardVerifyChainAck {
    optional uint32 counter  = 1;
    optional bytes  new_root = 2;  // absent if the adopted tree is empty
}

/**
 * The SYNC ROUND: how a device learns which tree is current.
 *
 *   WardSync              device mints a nonce for this round
 *   WardIngestAttestation host delivers the WM's signed (counter, mac); device checks it
 *   WardReconcile         host supplies the root; device binds it to the attested mac
 *                         and adopts it
 *
 * Three messages rather than one because the nonce must be minted BEFORE the host talks
 * to the WM -- that is what stops a host stockpiling signed anchors and replaying an old
 * one. The WM must sign a value it could not have known in advance.
 *
 * The WM is not trusted with contents. It signs a `mac` it cannot compute (see
 * WardIngestAttestation), so a malicious WM can only replay a state this wallet genuinely
 * reached, never invent one; the counter floor bounds which replays are accepted.
 */

/**
 * Request: begin a sync round.
 * @start
 * @next WardSyncAck
 * @next Failure
 */
message WardSync {
}

/**
 * Response: the nonce this round is bound to, and the handle the WM knows the wallet by.
 * @end
 */
message WardSyncAck {
    optional bytes nonce   = 1;  // 32B, minted now; the WM attestation must echo it
    optional bytes ward_id = 2;  // 32B opaque wallet handle; the host forwards it to the WM

    // The device's current head counter -- how a host discovers that a write it never saw
    // acknowledged actually landed. A delete whose response was lost leaves the host holding
    // the row and a root the device has moved past, so the retry is refused with nothing to
    // say why; comparing counters says which side is behind.
    //
    // Not secret. The WM holds it already, and it reveals only how many changes this wallet
    // has made -- never what any of them were.
    optional uint32 counter = 3;
}

/**
 * Request: deliver the WM's attestation of the current (counter, mac).
 *
 * The device verifies an Ed25519 signature over
 *
 *   b"WARD ATTEST v1" || version(1B) || nonce || ward_id || counter(4B BE) || mac
 *                   || timestamp(8B BE)
 *
 * under the provisioned WM key, requires the nonce to be this round's, and requires BOTH
 * counter >= the device's stored counter AND timestamp >= t_last - epsilon. It then
 * records the attested pair for the round -- adopting nothing yet, because the root has
 * not been seen.
 *
 * The timestamp catches what the counter alone cannot: an operator who restored the WM
 * from a backup, or whose clock jumped, typically regresses both together, and a forking
 * WM would have to keep time monotone per device on every branch. It does NOT constrain a
 * hostile WM, which simply lies about the time. The device has no clock and needs none --
 * this is a stored-value comparison, the same cost as the counter check.
 *
 * `mac` is HMAC(K_mac, ...) over the root; K_mac never leaves the device, so the WM signs
 * this without being able to produce it.
 * @start
 * @next WardIngestAttestationAck
 * @next Failure
 */
message WardIngestAttestation {
    optional uint32 counter      = 1;  // the counter the WM claims is current
    optional bytes  mac          = 2;  // 32B mac over the root at that counter
    optional bytes  wm_signature = 3;  // 64B Ed25519 over the preimage above
    optional uint64 timestamp    = 4;  // WM's clock, seconds; signed, and compared to t_last
}

/**
 * Response: the accepted counter.
 * @end
 */
message WardIngestAttestationAck {
    optional uint32 counter = 1;
}

/**
 * Request: supply the root, and adopt it.
 *
 * The device recomputes the mac over this root at the attested counter and requires it to
 * equal what the WM signed. That is what binds the freshness authority's claim to actual
 * contents: the host cannot substitute a different tree, because it cannot produce a mac.
 *
 * An absent root means the empty tree, which has its own mac at each counter rather than
 * being unbound -- otherwise a WM could attest "empty" for any counter it liked.
 * @start
 * @next WardReconcileAck
 * @next Failure
 */
message WardReconcile {
    optional bytes root = 1;  // 32B, or absent for the empty tree
}

/**
 * Response: the state the device adopted.
 * @end
 */
message WardReconcileAck {
    optional uint32 counter  = 1;
    optional bytes  new_root = 2;  // absent if the adopted tree is empty
}

/**
 * Request: demote the head by exactly one step.
 *
 * The escape from a stuck state. A device whose write never reached the WM is AHEAD of
 * it, so every sync is refused as a rollback and the wallet cannot move -- this undoes
 * that write so it can.
 *
 * The host presents the predecessor and the COMMIT authorisation that created the current
 * head from it. The device requires that authorisation to name its OWN current counter
 * and root, which does three things at once: it proves `to_root` really was the immediate
 * predecessor, it pins the demotion to one step, and it binds the counter.
 *
 * Binding the counter is not redundant with binding the root. Roots repeat whenever
 * contents repeat -- change a label and change it back -- so an OLD authorisation whose
 * `to_root` happens to equal today's head would otherwise be accepted, demoting the wallet
 * to a state from arbitrarily long ago in a single hop while satisfying the one-step rule
 * perfectly.
 *
 * The counter still moves FORWARD. The head points backward but the counter increments,
 * so no counter is ever reused and a stale authorisation cannot replay after a rollback.
 * @start
 * @next WardRollbackAck
 * @next Failure
 */
message WardRollback {
    // The link INTO the target state: the transition that produced it, with the COMMIT
    // authorisation only a device of this wallet could have minted. The device demotes to
    // to_root, which may be several steps back -- the missing links of the range being
    // discarded are exactly what a host in this situation does not have, so it cannot walk
    // back one step at a time and must jump to the last state whose link it does hold.
    //
    // to_counter is inside the MAC preimage, so the number of changes being discarded is
    // authenticated rather than asserted, which is what lets the screen state it.
    optional bytes  to_root      = 1;  // the target; absent means the empty tree
    optional bytes  auth_commit  = 2;  // over (from_counter, from_root) -> (to_counter, to_root)
    optional uint32 from_counter = 3;
    optional bytes  from_root    = 4;  // absent means the empty tree
    optional uint32 to_counter   = 5;
}

/**
 * Response: the demoted head, and the authorisation for the demotion itself.
 * @end
 */
message WardRollbackAck {
    optional uint32 counter     = 1;  // the OLD counter plus one -- never reused
    optional bytes  new_root    = 2;  // absent if the wallet is now empty
    optional bytes  auth_commit = 3;  // a REVERT link, for the host to record
    optional bytes  auth_sig    = 4;  // as WardLeafAck.auth_sig, over the REVERT preimage
}


/**
 * Request: accept an attestation that goes BACKWARDS, with the user's consent.
 *
 * If the WM's register is lost or its clock jumps back, every device with a stored
 * counter locks out: the monotonicity that protects against replay becomes a denial of
 * service against the owner. This is the way back.
 *
 * The device still requires a valid WM signature over this round's nonce, and still
 * requires the mac to match the root supplied afterwards -- so the state being adopted is
 * one this wallet genuinely reached. Only a device holding K_mac can produce a mac, so a
 * replayed (counter, mac) pair is proof of past presence, which is exactly the "root the
 * Trezor holds its own prior signature for" that recovery is supposed to demand.
 *
 * What it cannot check is INTENT. Everything here is cryptographically genuine; the
 * question is whether the user means to give up the state in between. That makes this the
 * strongest social-engineering target in the protocol -- anyone who can talk a user
 * through it can replay old state wholesale -- so the confirmation names both counters and
 * the age of what is being reverted to, and holds.
 * @start
 * @next WardRecoverCounterAck
 * @next Failure
 */
message WardRecoverCounter {
    optional uint32 counter      = 1;
    optional bytes  mac          = 2;
    optional bytes  wm_signature = 3;
    optional uint64 timestamp    = 4;
}

/**
 * Response: the round is now attested at the lower counter; reconcile follows as usual.
 * @end
 */
message WardRecoverCounterAck {
    optional uint32 counter = 1;
}


/**
 * Request: keep the entry at (app_id, identifier) on the device for offline use.
 *
 * The device pulls the leaf, verifies it as a read would, shows the value and asks. Only
 * then is anything written. Pinning is EXPLICIT because persistent storage is small and
 * shared: viewing an entry once should not consume a slot that the user must later be asked
 * to give up.
 *
 * The device derives entry_key itself, exactly as WardGetEntry does -- the host cannot name
 * a path to pin.
 *
 * If the store is full the request FAILS and nothing is evicted: every occupant is either a
 * value the user chose to keep or a change they confirmed and that is not published yet.
 * @start
 * @next Success
 * @next Failure
 */
message WardPinCachedEntry {
    optional string app_id     = 1;  // domain that owns the entry
    optional bytes  identifier = 2;  // key within that domain
}

/**
 * Request: remove the device's local copy of (app_id, identifier).
 *
 * NOT a WARD deletion. This erases only what this device holds; the entry itself is
 * untouched, and `WardDeleteEntry` remains the way to remove one. Kept separate because the
 * two answer different questions -- "stop keeping this here" and "this should no longer
 * exist" -- and one confirmation cannot honestly stand for both.
 *
 * This is also the ONLY way a record leaves flash. Nothing evicts, expires, or cleans up:
 * staleness, supersession and an unreadable format all leave the record in place and require
 * the user to say so here. The screen shows what is being lost before the hold.
 *
 * The device derives entry_key itself; the host cannot name an arbitrary path to erase.
 * @start
 * @next Success
 * @next Failure
 */
message WardEraseCachedEntry {
    optional string app_id     = 1;  // domain that owns the entry
    optional bytes  identifier = 2;  // key within that domain
}

/**
 * Request: publish ONE queued change, sealed.
 *
 * Changes made with no synced host are held locally in the clear -- the device's own storage
 * already encrypts and authenticates them -- and are sealed HERE, on the way out, because
 * that is where they stop being covered by it.
 *
 * A queued intent is an INTENT, not a transition: it was formed with no root to derive
 * against, so this re-derives it against CURRENT state. The device pulls the entry's present
 * leaf, proves it against the trusted root, and only then computes the new root and stamps
 * the next counter.
 *
 * One change per request, and the host repeats until `remaining` reads zero. A queued batch
 * has no transaction to apply under, so this bounds a partial application to a single step
 * rather than pretending the batch is atomic.
 *
 * The change stays queued until a WardReconcile adopts its counter -- the same boundary an
 * online write commits at. A host that never publishes leaves it queued and re-sendable,
 * which is the recoverable direction.
 *
 * Requires a synced session: with no trusted root there is nothing to derive against.
 * @start
 * @next WardFlushQueueAck
 * @next Failure
 */
message WardFlushQueue {
}
