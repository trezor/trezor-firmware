syntax = "proto2";
package hw.trezor.messages.ward;

// Sugar for easier handling in Java
option java_outer_classname = "TrezorMessageWardConnect";
option java_package = "com.satoshilabs.trezor.lib.protobuf";

import "messages-ward.proto";

/*
 * WARD OVER THE ORDINARY CONNECTION.
 *
 * These messages exist only in a firmware that serves WARD over the same channel the WARD app is
 * already talking on -- so on this build the app owns the replica as well as invoking the
 * operations. They are the ones a WARD service channel replaces rather than reuses:
 *
 *   the device-initiated pull (WardEntryRequest) and the leaf-bearing acks a mutation returns,
 *   which a service build answers with its own request/response pair instead;
 *
 *   the three-message sync round and the two head-recovery requests, which a service build folds
 *   into device-initiated RPCs -- so a host cannot move the trusted head on a build where the
 *   service owns the replica.
 *
 * Shared types live in `messages-ward.proto`.
 */

/**
 * Response: device -> host, sent mid-workflow. Names the entry the device wants, as an
 * OPAQUE KEYED PATH. Emitted by all three requests above; the host must reply with
 * WardEntryAck.
 *
 * The device derives entry_key itself and NEVER accepts one from the host, so the host
 * cannot steer a read or a write at a slot of its choosing:
 *
 *   K_path    = SLIP21(seed, ["ward", "K_path"])
 *   scope     = app_id || 0x00 || key_type || 0x00 || device_id(1B)
 *   entry_key = HMAC-SHA256(K_path, scope || identifier)
 *
 * K_path is passphrase-dependent, so every hidden wallet has its own key space and the
 * same identifier maps to different paths under different passphrases.
 */
message WardEntryRequest {
    reserved 1, 2;                  // were app_id, identifier -- now folded into entry_key
    optional bytes entry_key = 3;   // 32B keyed path; the host serves by this alone
}

/**
 * Response: device -> host, ending a WardSetEntry or WardDeleteEntry.
 *
 * Carries the leaf the DEVICE built, because the host cannot build one itself once the
 * parts are sealed -- it has none of the keys. The host stores this verbatim under
 * entry_key; for a delete, both parts are empty and the host removes the record.
 *
 * The host has no other way to learn entry_key, so this is also how a newly created
 * entry acquires its key.
 *
 * ONLY FOR A LEAF THAT ENTERED THE TRIE. Every ack of this type reports a real transition of
 * the tree: a new or replaced leaf, or the empty-part leaf of a delete. Nothing that merely
 * touched the device's own queue is reported here -- those have their own messages, and keeping
 * them out is why this one can promise a leaf and a path at all.
 */
message WardLeafAck {
    required bytes        entry_key = 1;  // 32B keyed path this leaf belongs at; ALWAYS set
    optional WardLeafIdentity identity  = 2;
    optional WardLeafContent  content   = 3;  // empty part = the entry was deleted

    // The state this write produced. The DEVICE is the counter authority -- it derived
    // the new root and stamped the next counter on it -- and the host must publish this
    // pair to the WM so the WM's view matches. Until it does, the device is ahead of the
    // WM and its next sync will be REFUSED as a rollback: fail-closed, and recoverable by
    // publishing, which is the right way round compared with silently losing the write.
    optional uint32 counter = 4;

    // 5 was `mac`: HMAC(K_mac, ...) over (counter, new_root), the value the WM stored and
    // attested. K_mac is gone -- the WM now holds `(counter, root)` in the clear, so the pair
    // the host publishes is the counter above and the root it already derived. Reserved rather
    // than reused, so a stale host's field 5 cannot be read as something else.
    reserved 5;

    // Authorises THIS transition: HMAC(K_auth, len8(tag) || tag || ward_id || from_counter ||
    // from_root || to_counter || to_root). The host stores it with the link -- it knows
    // both endpoints, having held the tree before and after -- so that another device of
    // this wallet can later verify the step without having witnessed it.
    //
    // THE ONLY AUTHENTICATOR LEFT, and therefore the only thing standing between a wallet and a
    // WM that names a state it invented. Descent is proved by folding these; an attestation on
    // its own now proves freshness and nothing more.
    optional bytes auth_commit = 6;

    // 7 was `auth_sig`: Ed25519 under K_sig over the ROOT transition. Removed because nothing
    // verified it -- not the firmware, not the mock WM. Its replacement is `wm_sig` at field 10,
    // which covers exactly the bytes `auth_commit` MACs.
    reserved 7;

    // 8 and 9 were `queued` and `remaining`, which only ever applied to the OFFLINE QUEUE.
    // They now live on WardQueueAck, which is a separate message precisely so that neither
    // field can appear on an ack that carries a real leaf. Reserved rather than reused, so a
    // stale host cannot have an old field silently reinterpreted.
    reserved 8, 9;

    // THE WM-FACING AUTHORISATION for this same transition: Ed25519 under K_sig over exactly the
    // bytes `auth_commit` MACs, verifiable against `ward_id` (which IS that key's public half).
    // The host forwards it with `(counter, root)` when it publishes, and the WM refuses an
    // advance without it.
    //
    // WHY IT HAS TO BE HERE. Without it a WM has nothing to check, so whoever knows `ward_id`
    // can advance the counter and have every genuine device refused from then on -- the WM
    // becomes a denial-of-service oracle. The service channel has carried this since it existed;
    // connect, the transport that is actually developed, did not, so the authenticated
    // compare-and-swap the design rests on was performed nowhere.
    //
    // ABSENT ON A NO-OP. An idempotent delete of a path that already held nothing produced no
    // transition, so it carries neither this nor `auth_commit`.
    optional bytes wm_sig = 10;
}

/**
 * Response: device -> host, ending a WardFlushQueue.
 *
 * A published queued change IS an ordinary leaf -- sealed here, re-derived against proven
 * current state -- so this carries exactly what WardLeafAck carries, plus the one thing only a
 * drain needs. It is a separate message so that `remaining` cannot appear on an ack for a write
 * the host made directly, where it would mean nothing.
 *
 * With an EMPTY QUEUE only `remaining = 0` is set: there is no leaf and no path, because there
 * was no change to publish.
 * @end
 */
message WardFlushQueueAck {
    optional bytes            entry_key = 1;  // absent when the queue was already empty
    optional WardLeafIdentity identity  = 2;
    optional WardLeafContent  content   = 3;

    // The state this publication claimed, as on WardLeafAck: the device derived the new root and
    // stamped the next counter, and the host must publish the pair to the WM.
    optional uint32 counter = 4;
    reserved 5;                      // was `mac`; see WardLeafAck

    optional bytes auth_commit = 6;  // authorises this transition; see WardLeafAck.auth_commit
    reserved 7;                      // was auth_sig; see WardLeafAck

    // How many queued changes remain after this one. The host loops until it reads zero. One
    // intent per round-trip, so a failure costs one step rather than a batch -- see the
    // atomicity note in the device's storage/ward.py.
    required uint32 remaining = 8;

    optional bytes wm_sig = 9;  // for the WM; see WardLeafAck.wm_sig
}

/**
 * Request: adopt the attested head by proving the device's OWN head is an ANCESTOR of it.
 *
 * Runs after WardIngestAttestation, in place of WardReconcile, and it is the one connect
 * flow the DEVICE drives: it anchors at the attested head and then pulls predecessors with
 * WardChainRequest until it arrives at the head it already holds.
 *
 * WHY BACKWARD, AND NOT FORWARD FROM THE DEVICE'S HEAD. Folding forward, the endpoint is
 * wherever the host walks the device, and only a terminal check catches a wrong one -- so an
 * intermediate reached along the way is proved by DESCENT alone, and descent cannot tell one
 * branch from another. Every device hands out an `auth_commit` on WardLeafAck before knowing
 * whether the write landed (see WardLeafAck), so a merely retentive host holds genuine links
 * for transitions the WM never accepted, and a forward fold will walk onto one.
 *
 * Anchoring at the attested head inverts that. Every state the walk reaches is an ANCESTOR of
 * a head the WM vouched for, so it cannot be on a fork BY CONSTRUCTION rather than by a rule:
 * each request names the `to` end it wants, and a link that ends anywhere else is refused
 * before its MAC is even checked.
 *
 * It also removes the ceiling that made staged batching necessary. Links no longer travel as
 * one unchunked repeated field, so the 8704-byte buffer bounds a single WardChainLinkAck
 * rather than the catch-up distance, and a device arbitrarily far behind catches up in one
 * workflow with nothing persisted until it completes.
 *
 * Descent is not currency: the WM attestation supplies that. See the anchor fields below.
 * @start
 * @next WardChainRequest
 * @next WardVerifyChainAck
 * @next Failure
 */
message WardVerifyChain {
    reserved 1;  // was `repeated WardChainLink links`; the device pulls them one ack at a time

    // 2-8 were the ARCHIVED ANCHOR: nonce, timestamp, wm_signature, head_root, anchor_counter,
    // anchor_from_counter, anchor_from_root. A walk could anchor on an attestation the host had
    // KEPT from when an earlier head was current, adopting without claiming currency.
    //
    // REMOVED, because it raised the persisted counter with no freshness and no consent. After a
    // user-confirmed WardRecoverCounter lowered the head from 57 to 10, a host still holding the
    // archived attestation for 57 and the links up to it walked the device straight back -- the
    // device persists the counter before it decides about latching, so the recovery was undone
    // silently and the wallet stranded again. It also no longer bought anything: it existed for
    // staged catch-up, from when links travelled as one repeated field and the buffer bounded the
    // catch-up DISTANCE, and the backward pull removed that ceiling. Nothing tested it.
    //
    // The archived attestation still exists where it answers its own question -- WardRollback,
    // where the counter moves FORWARD and the user holds to confirm.
    reserved 2, 3, 4, 5, 6, 7, 8;

    // NO FIELDS AT ALL. The anchor is this round's attestation, which the device already holds:
    // the WM names both ends of the step in the clear, so there is nothing for a host to supply
    // and nothing for it to choose. Run WardIngestAttestation first.
}

/**
 * Response: the device asks for the link that ENDS at a state it has already established.
 *
 * Sent repeatedly during WardVerifyChain, walking backwards, until the device reaches its own
 * head. The pair it names is not a hint the host may improve on: a returned link whose `to` end
 * differs is refused, which is what keeps an orphaned branch out of the walk.
 * @next WardChainLinkAck
 */
message WardChainRequest {
    optional uint32 to_counter = 1;
    optional bytes  to_root    = 2;  // absent means the empty tree
}

/**
 * Request: the predecessors the device asked for, NEWEST FIRST.
 *
 * More than one may be sent -- each link's `to` end must match the `from` end of the one before
 * it, so a full ack is a contiguous run walking backwards from the requested state. Sending as
 * many as fit is the fast path; sending one is always correct. An empty ack ends the walk with a
 * failure, which is the honest answer when the host does not hold the range.
 * @next WardChainRequest
 * @next WardVerifyChainAck
 * @next Failure
 */
message WardChainLinkAck {
    repeated WardChainLink links = 1;
}

/**
 * Response: the head the device adopted.
 * @end
 */
message WardVerifyChainAck {
    optional uint32 counter  = 1;
    optional bytes  new_root = 2;  // absent if the adopted tree is empty

    // How many of the transitions crossed were DEMOTIONS -- steps carrying an older root, issued
    // by another device's rollback. The device already warns on screen; this is the same fact for
    // a host that wants to say it in its own UI, and for a build with no screen at all.
    //
    // A COUNT IS THE WHOLE ANSWER, not a first approximation of one. Naming which entries were
    // discarded would need the counter the restored root originally belonged to, and that is not
    // on WardChainLink -- putting it there means binding it into auth_commit's preimage, since
    // anything outside the MAC is forgeable. Decided as not worth it: what a user or a host has
    // to act on is that the wallet went backwards and by how many steps, which this carries.
    optional uint32 reverts_crossed = 3;
}

/**
 * The SYNC ROUND: how a device learns which tree is current.
 *
 *   WardSync              device mints a nonce for this round
 *   WardIngestAttestation host delivers the WM's signed (counter, root); device checks it
 *   WardReconcile         host presents the link into that head; device folds it and adopts
 *
 * Three messages rather than one because the nonce must be minted BEFORE the host talks
 * to the WM -- that is what stops a host stockpiling signed anchors and replaying an old
 * one. The WM must sign a value it could not have known in advance.
 *
 * WHAT THE WM IS AND IS NOT TRUSTED FOR. It is the authority on FRESHNESS and ORDERING: which of
 * this wallet's states is current. It is not an authority on state at all -- it signs roots in
 * the clear, so nothing in its signature stops it naming a root this wallet never held. What
 * stops that mattering is that every adoption also folds an `auth_commit`, which needs K_auth,
 * which the WM does not have: WardReconcile folds the one link into the attested head,
 * WardVerifyChain walks the whole way back to a state the device already holds. The counter
 * floor bounds it further, refusing anything below what this device has accepted.
 *
 * It used to be bounded more tightly -- it attested a MAC it could not compute, so it could only
 * ever replay real history. That key is gone; descent replaces it.
 */

/**
 * Request: begin a sync round.
 * @start
 * @next WardSyncAck
 * @next Failure
 */
message WardSync {
}

/**
 * Response: the nonce this round is bound to, and the handle the WM knows the wallet by.
 * @end
 */
message WardSyncAck {
    optional bytes nonce   = 1;  // 32B, minted now; the WM attestation must echo it
    optional bytes ward_id = 2;  // 32B opaque wallet handle; the host forwards it to the WM

    // The device's current head counter -- how a host discovers that a write it never saw
    // acknowledged actually landed. A delete whose response was lost leaves the host holding
    // the row and a root the device has moved past, so the retry is refused with nothing to
    // say why; comparing counters says which side is behind.
    //
    // Not secret. The WM holds it already, and it reveals only how many changes this wallet
    // has made -- never what any of them were.
    optional uint32 counter = 3;

    // THE OPENING HEAD, AND ITS AUTHORISATION -- how a connect host ENROLS a wallet with a WM
    // that has never seen it. NOT a way to re-seed a WM that lost its register; see below.
    //
    // A compare-and-swap needs something to compare against, and a WM with no record of this
    // wallet has nothing. The first head therefore has to come from the device and be
    // authenticated, or it is a value anyone who knows `ward_id` could set -- which is the same
    // denial of service `wm_sig` closes for ordinary advances.
    //
    // ENROLMENT IS GENESIS ONLY. `head_init_sig` proves the head it names was a genuine state of
    // this wallet; it does not prove that head is the LATEST one, and nothing one device holds
    // could. Two devices at counters 40 and 57 both hold authentic signatures over their own
    // heads, so a WM enrolling at an arbitrary counter would let whichever reached it first pin
    // the head there and have the other refused against older state. At counter 0 there is
    // nothing to choose between. The device enforces the same rule when the attestation comes
    // back: only counter 0 may attest itself.
    //
    // `head_init_sig` is Ed25519 under K_sig over the SELF-TRANSITION (counter, root) ->
    // (counter, root) under b"WARD WM INIT v2". Its own tag, so it can never be replayed as an
    // advance. SENT ALWAYS, not only when the device believes the WM is new: the device cannot
    // know the WM's state, and guessing "it knows us" strands a wallet that nothing can open.
    // The WM ignores it once it holds a head, so the cost is one signature per round.
    //
    // `root` is not secret on this transport -- a connect host holds the whole tree already.
    optional bytes root          = 4;  // absent means the empty tree
    optional bytes head_init_sig = 5;  // 64B Ed25519
}

/**
 * Request: deliver the WM's attestation of the current (counter, root).
 *
 * The device verifies an Ed25519 signature over
 *
 *   b"WARD ATTEST v1" || version(1B=4) || nonce || ward_id
 *                   || from_counter(4B BE) || from_root || to_counter(4B BE) || to_root
 *                   || timestamp(8B BE)
 *
 * under the provisioned WM key, requires the nonce to be this round's, and requires BOTH
 * counter >= the device's stored counter AND timestamp >= t_last - epsilon. It then
 * records the attested pair for the round -- adopting nothing yet, because the root has
 * not been seen.
 *
 * The timestamp catches what the counter alone cannot: an operator who restored the WM
 * from a backup, or whose clock jumped, typically regresses both together, and a forking
 * WM would have to keep time monotone per device on every branch. It does NOT constrain a
 * hostile WM, which simply lies about the time. The device has no clock and needs none --
 * this is a stored-value comparison, the same cost as the counter check.
 *
 * IT NAMES THE STEP, not the head alone -- the same statement `auth_commit` MACs. A bare state
 * left the PREDECESSOR for the host to choose among any links it held ending at the attested
 * head, and two can coexist because a write and a revert may land on the same root at the same
 * counter. Nothing was forgeable that way, but the device credited the wrong transition when
 * settling queued writes. Naming the step removes the choice.
 *
 * The roots are in the clear. There used to be a keyed indirection -- HMAC(K_mac, ...) -- which
 * kept the WM blind and bounded it to replaying states this wallet genuinely reached. Both are
 * gone: a malicious WM can name a transition the wallet never took, and what refuses it is the
 * link or the chain folded against this attestation afterwards, never the attestation itself.
 * @start
 * @next WardIngestAttestationAck
 * @next Failure
 */
message WardIngestAttestation {
    // 1 and 2 were `counter` and `root`, naming the head alone. Both ends travel now, under the
    // from/to naming the rest of this file uses for a transition. Reserved rather than widened in
    // place, so a stale host cannot have `counter` read as one end of a step it never meant.
    reserved 1, 2;

    optional bytes  wm_signature = 3;  // 64B Ed25519 over the preimage above
    optional uint64 timestamp    = 4;  // WM's clock, seconds; signed, never compared

    optional uint32 to_counter   = 5;  // the head the WM claims is current...
    optional bytes  to_root      = 6;  // ...absent means the empty tree
    optional uint32 from_counter = 7;  // the head it advanced from; to_counter - 1
    optional bytes  from_root    = 8;  // absent means the empty tree

    // GENESIS ATTESTS ITSELF: at counter 0 nothing produced the head, so the two ends are equal
    // and the empty tree stands on both. No real step has from == to, so the two cannot be
    // confused -- see apps/ward/attest.attestation_preimage.
}

/**
 * Response: the accepted counter.
 * @end
 */
message WardIngestAttestationAck {
    optional uint32 counter = 1;
}

/**
 * Request: adopt the attested head, presenting the link that produced it.
 *
 * THE HOST NO LONGER SUPPLIES THE ROOT. The WM attests `(counter, root)` in the clear, so the
 * root arrives inside the signature the round already verified; there is nothing left for the
 * host to name and nothing to bind it with. Field 1 carried that root and is reserved.
 *
 * WHAT THE HOST SUPPLIES INSTEAD is the transition INTO the attested head:
 * `(counter - 1, from_root) -> (counter, attested root)` with its `auth_commit`. That is what
 * makes the attestation a statement about this wallet rather than about whatever the WM chose
 * to sign -- only a holder of K_auth can mint one.
 *
 * STILL THE WEAKER OF THE TWO ADOPTION ROUTES. One link proves the step was authorised; it does
 * not prove the predecessor was on the authoritative line, so a host holding a genuine link from
 * an abandoned branch satisfies this. WardVerifyChain walks back to a state the device already
 * holds and rules that out. Prefer it; this is for the one-step case.
 *
 * At counter 0 there is no transition to present: the three fields must be absent and the
 * attested root must be the empty tree.
 * @start
 * @next WardReconcileAck
 * @next Failure
 */
message WardReconcile {
    reserved 1;     // was `root`; the attested root is the WM's, not the host's
    reserved 2, 3;  // were `from_counter`/`from_root`; the attestation names the step now

    // THE ONLY FIELD LEFT, and the only thing the host contributes to an adoption: a COMMIT or
    // REVERT authorisation over the transition the WM attested. Both ends come from that
    // signature, so there is nothing here for a host to choose.
    optional bytes auth_commit = 4;
}

/**
 * Response: the state the device adopted.
 * @end
 */
message WardReconcileAck {
    optional uint32 counter  = 1;
    optional bytes  new_root = 2;  // absent if the adopted tree is empty
}

/**
 * Request: demote the head by exactly one step.
 *
 * The escape from a stuck state. A device whose write never reached the WM is AHEAD of
 * it, so every sync is refused as a rollback and the wallet cannot move -- this undoes
 * that write so it can.
 *
 * The host presents the predecessor and the COMMIT authorisation that created the current
 * head from it. The device requires that authorisation to name its OWN current counter
 * and root, which does three things at once: it proves `to_root` really was the immediate
 * predecessor, it pins the demotion to one step, and it binds the counter.
 *
 * Binding the counter is not redundant with binding the root. Roots repeat whenever
 * contents repeat -- change a label and change it back -- so an OLD authorisation whose
 * `to_root` happens to equal today's head would otherwise be accepted, demoting the wallet
 * to a state from arbitrarily long ago in a single hop while satisfying the one-step rule
 * perfectly.
 *
 * The counter still moves FORWARD. The head points backward but the counter increments,
 * so no counter is ever reused and a stale authorisation cannot replay after a rollback.
 * @start
 * @next WardRollbackAck
 * @next Failure
 */
message WardRollback {
    // The link INTO the target state: the transition that produced it, with the COMMIT
    // authorisation only a device of this wallet could have minted. The device demotes to
    // to_root, which may be several steps back -- the missing links of the range being
    // discarded are exactly what a host in this situation does not have, so it cannot walk
    // back one step at a time and must jump to the last state whose link it does hold.
    //
    // to_counter is inside the MAC preimage, so the number of changes being discarded is
    // authenticated rather than asserted, which is what lets the screen state it.
    optional bytes  to_root      = 1;  // the target; absent means the empty tree
    optional bytes  auth_commit  = 2;  // over (from_counter, from_root) -> (to_counter, to_root)
    optional uint32 from_counter = 3;
    optional bytes  from_root    = 4;  // absent means the empty tree
    optional uint32 to_counter   = 5;

    // THE PROOF THAT THE TARGET WAS EVER THE HEAD, and it is REQUIRED. `auth_commit` above says
    // a holder of this wallet's K_auth authorised the target; it does not say the target was
    // ever authoritative, so a host could present a link from an orphaned fork. These three are
    // the attestation the WM issued when the target was current, kept by the host and replayed
    // here: the device checks the signature over ALL FOUR operands above -- the very transition
    // `auth_commit` names -- which together say the WM actually took this step. An attestation
    // that merely ended in the same place no longer satisfies it.
    //
    // A HOST THAT DID NOT ARCHIVE CANNOT ROLL BACK. That is a deliberate narrowing of an escape
    // hatch this message's own docstring once said should need no attestation -- the reasoning
    // there was aimed at a LIVE attestation, which would need the WM reachable in the very
    // situation rollback exists for. An archived one does not, but it does need to have been
    // kept, so hosts must begin archiving at their first sync after upgrade.
    optional bytes  nonce        = 6;  // the nonce that attestation was minted under
    optional uint64 timestamp    = 7;
    optional bytes  wm_signature = 8;
}

/**
 * Response: the demoted head, and the authorisation for the demotion itself.
 * @end
 */
message WardRollbackAck {
    optional uint32 counter     = 1;  // the OLD counter plus one -- never reused
    optional bytes  new_root    = 2;  // absent if the wallet is now empty
    optional bytes  auth_commit = 3;  // a REVERT link, for the host to record
    reserved 4;                       // was auth_sig; see WardLeafAck
    // The WM-facing authorisation for the demotion, under "WARD WM REVERT v2". A revert
    // advances the head like any write -- forward, carrying an OLDER root -- so without its
    // own tag the WM cannot tell a demotion from an ordinary advance and cannot apply policy
    // to one. Same preimage shape as an ordinary wm_sig; only the tag differs.
    optional bytes  wm_sig      = 5;
}

/**
 * Request: accept an attestation that goes BACKWARDS, with the user's consent.
 *
 * If the WM's register is lost or its clock jumps back, every device with a stored
 * counter locks out: the monotonicity that protects against replay becomes a denial of
 * service against the owner. This is the way back.
 *
 * The device still requires a valid WM signature over this round's nonce, and still
 * requires the link folded afterwards to name it -- so the state being adopted is
 * one this wallet genuinely reached. Only a device holding K_auth can produce that link, so a
 * replayed attestation plus a genuine link is proof of past presence, which is exactly the "root the
 * Trezor holds its own prior signature for" that recovery is supposed to demand.
 *
 * What it cannot check is INTENT. Everything here is cryptographically genuine; the
 * question is whether the user means to give up the state in between. That makes this the
 * strongest social-engineering target in the protocol -- anyone who can talk a user
 * through it can replay old state wholesale -- so the confirmation names both counters and
 * the age of what is being reverted to, and holds.
 * @start
 * @next WardRecoverCounterAck
 * @next Failure
 */
message WardRecoverCounter {
    reserved 1, 2;                     // were `counter` and `root`; see WardIngestAttestation

    // The WM'S OWN HEAD, attested against this round's nonce -- the step it most recently took,
    // which after a register loss is BEHIND this device. It is the predecessor the demotion
    // extends and the pair the WM will compare-and-swap on, so it has to be the WM's current
    // head and not a state the host names.
    optional bytes  wm_signature = 3;
    optional uint64 timestamp    = 4;
    optional uint32 to_counter   = 5;
    optional bytes  to_root      = 6;  // absent means the empty tree
    optional uint32 from_counter = 7;
    optional bytes  from_root    = 8;  // absent means the empty tree

    // THE STATE TO COME BACK TO: a root the HOST can reconstruct from the rows it actually holds,
    // proposed by it and approved by the user on the device. Absent means the empty tree.
    //
    // NOT REQUIRED TO HAVE BEEN A HEAD, which is the difference from WardRollback. A host that
    // lost rows rebuilds a tree the wallet may never have had, and reverting to something it can
    // still serve is the entire point of the escape hatch; demanding an archived attestation
    // would make the hatch unavailable in exactly the situation it exists for. Rollback can
    // demand one because it runs while the WM is healthy. Here the WM's record is the thing that
    // was lost, so the user's approval is the authority and the screen says so.
    optional bytes  recovered_root = 9;
}

/**
 * Response: the round is now attested at the lower counter; reconcile follows as usual.
 * @end
 */
message WardRecoverCounterAck {
    // THE DEMOTION, for the host to publish. Shaped exactly like WardRollbackAck, because a
    // recovery IS a rollback -- the only thing that differs is that it was built against the WM's
    // head rather than this device's. A host replaying its transition log treats it the way it
    // treats any REVERT row: load the whole trie at `new_root` rather than apply a leaf delta,
    // since the two ends are not one edit apart.
    //
    // NOTHING IS ADOPTED YET. The head moves when the WM confirms this and a sync round brings
    // it back, which is the invariant every write obeys. The device has recorded the user's
    // consent for that one counter, and for nothing else.
    optional uint32 counter     = 1;  // wm_counter + 1 -- forward, though the head goes back
    optional bytes  new_root    = 2;  // absent if the recovered tree is empty
    optional bytes  auth_commit = 3;  // REVERT, for the other devices of this wallet
    optional bytes  wm_sig      = 4;  // REVERT, for the WM
}
