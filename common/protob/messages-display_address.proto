syntax = "proto2";
package hw.trezor.messages.display_address;

import "messages-common.proto";
import "options.proto";

option java_outer_classname = "TrezorMessageDisplayAddress";
option java_package = "com.satoshilabs.trezor.lib.protobuf";

/**
 * Request: Show an arbitrary address on-screen with a PULL-authenticated WARD
 * label. The firmware emits a WARDProofRequest naming the address; the host answers
 * with a WARDProofAck; the firmware verifies that proof against its authenticated
 * WARD root (through the Core capability boundary) and shows the verified label as
 * the account name (or none, for non-membership/unknown).
 *
 * The PUSH variant (host supplies the proof up-front) is DisplayAddressWithProof.
 *
 * Returns a standard Success after confirmation.
 * @start
 * @next WARDProofRequest
 * @next Success
 * @next Failure
 */
message DisplayAddress {
    required string address = 1;          // address to display
    optional string title = 2;            // custom screen title
    optional string subtitle = 3;         // custom subtitle
    optional bool case_sensitive = 4 [default = true];
    optional bool chunkify = 5;           // display the address in chunks of 4 characters
}

/**
 * Request: Show an arbitrary address on-screen with a PUSH-authenticated WARD label
 * — the host attaches the proof up-front instead of answering a pull. The firmware
 * verifies the supplied (membership: value/counter; non-membership: witness_*)
 * proof against its authenticated WARD root and shows the verified label.
 *
 * The PULL variant (device requests the proof on demand) is DisplayAddress.
 * @start
 * @next Success
 * @next Failure
 */
message DisplayAddressWithProof {
    required string address = 1;          // address to display
    optional string title = 2;            // custom screen title
    optional string subtitle = 3;         // custom subtitle
    optional bool case_sensitive = 4 [default = true];
    optional bool chunkify = 5;           // display the address in chunks of 4 characters
    optional bytes  value           = 6;  // membership: the value stored at address
    repeated bytes  proof           = 7;  // sibling hashes, leaf-to-root (33 bytes each)
    optional uint32 counter         = 8;  // membership: leaf counter for address
    optional bytes  witness_address = 9;  // non-membership: witness leaf address
    optional bytes  witness_value   = 10; // non-membership: witness leaf value
    optional uint32 witness_counter = 11; // non-membership: witness leaf counter
}
