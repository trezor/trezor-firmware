name: MemBrowse PR comment

# Runs in the base repository after the Core workflow, so it can comment on fork PRs too.
on:
  workflow_run:
    workflows: [Core]
    types:
      - completed

permissions:
  contents: read

jobs:
  comment:
    name: Post memory report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip cancelled runs, e.g. superseded by a newer push to the same PR
    if: >
      env.MEMBROWSE_API_KEY != '' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: membrowse/membrowse-action/comment-action@14677ae592be153b43eb7dbe4f542cf0c7d098ed  # membrowse/membrowse-action@v1.2.18
        with:
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          commit: ${{ github.event.workflow_run.head_sha }}
        env:
          MEMBROWSE_API_KEY: ${{ secrets.MEMBROWSE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
