name: MemBrowse PR comment

# Runs in the base repository after the Core workflow, so it can comment on fork PRs too.
on:
  workflow_run:
    workflows: [Core]
    types:
      - completed

permissions:
  contents: read

jobs:
  comment:
    name: Post memory report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip cancelled runs, e.g. superseded by a newer push to the same PR
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: membrowse/membrowse-action/comment-action@e96401eefb1c32f1f9aff0fcd18c73288c081808  # membrowse/membrowse-action@v1.3.3
        with:
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          commit: ${{ github.event.workflow_run.head_sha }}
          comment_template: .github/membrowse-comment.j2
          footer: false
          skip_unchanged: true
        env:
          MEMBROWSE_API_KEY: ${{ secrets.MEMBROWSE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: env.MEMBROWSE_API_KEY != ''
