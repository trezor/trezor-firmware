name: Hardware tests
run-name: Hardware tests on ${{ inputs.models_json != '' && join(fromJSON(inputs.models_json), ', ') || 'all models' }}

on:
  schedule:
    - cron: '15 23 * * *'  # every day @ 23:15
  workflow_dispatch:
    inputs:
      models_json:
        description: models as a JSON list
        type: string
        required: true
        default: "[\"T1B1\",\"T2B1\",\"T2T1\",\"T3B1\",\"T3T1\",\"T3W1\"]"
      ward_only:
        description: Run only WARD channel tests
        type: boolean
        default: false

permissions:
  contents: read        # for actions/checkout

# [Device tests](../tests/device-tests.md) that run against an actual physical Trezors.
# The device needs to have special bootloader, found in `core/embed/projects/bootloader_ci`, that
# makes it possible to flash firmware without confirmation on the touchscreen.
#
# All hardware tests are run nightly on the `main` branch,
# and also can be started manually.
#
# Currently it's not possible to run all regular TT tests without getting into
# a state where the micropython heap is too fragmented and allocations fail
# (often manifesting as a stuck test case). For that reason some tests are
# skipped.
# See also: https://github.com/trezor/trezor-firmware/issues/1371
jobs:
  param:
    name: Determine pipeline parameters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No scheduled runs on forks.
    if: github.repository == 'trezor/trezor-firmware' || github.event_name != 'schedule'
    outputs:
      core_models: ${{ steps.set_vars.outputs.core_models }}
      ward_models: ${{ steps.set_vars.outputs.ward_models }}
      run_legacy: ${{ steps.set_vars.outputs.run_legacy }}
    steps:
      - id: set_vars
        name: Set variables
        env:
          MODELS: ${{ github.event_name == 'workflow_dispatch' && inputs.models_json || '["T1B1","T2B1","T2T1","T3B1","T3T1","T3W1"]' }}
          WARD_ONLY: ${{ inputs.ward_only && 'true' || 'false' }}
        run: |
          echo "models_json: $MODELS"
          CORE_MODELS=`echo $MODELS | jq -cM '[.[] | select(. != "T1B1")]'`
          if [ "$WARD_ONLY" = "true" ]; then
            CORE_MODELS='[]'
          fi
          echo core_models=$CORE_MODELS >> $GITHUB_OUTPUT
          WARD_MODELS=$(echo "$MODELS" | jq -cM '[.[] | select(. == "T3T1" or . == "T3W1")]')
          echo ward_models=$WARD_MODELS >> "$GITHUB_OUTPUT"
          if [ "$WARD_ONLY" != "true" ] && echo $MODELS | grep -q '"T1B1"'; then
            echo run_legacy=1 >> $GITHUB_OUTPUT
          else
            echo run_legacy=0 >> $GITHUB_OUTPUT
          fi
          cat $GITHUB_OUTPUT

  core_device_test:
    name: Device tests
    needs: param
    runs-on:
      - self-hosted
      - ${{ matrix.model == 'T2B1' && 'hw-t2b1' || matrix.model == 'T3T1' && 'hw-t3t1' || matrix.model == 'T3B1' && 'hw-t3b1' || matrix.model == 'T3W1' && 'hw-t3w1' || 'hw-t2t1' }}
    if: needs.param.outputs.core_models != '[]'
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.param.outputs.core_models) }}
        coins: [universal, btconly]
    env:
      TREZOR_MODEL: ${{ matrix.model }}
      BITCOIN_ONLY: ${{ matrix.coins == 'btconly' && '1' || '0' }}
      WARD: ${{ matrix.coins == 'universal' && '1' || '0' }}
      PYTEST_TIMEOUT: 600  # 10m single test timeout
      PYOPT: 0
      DISABLE_OPTIGA: 1
      DISABLE_TROPIC: 1
      STORAGE_INSECURE_TESTING_MODE: 1
      BOOTLOADER_DEVEL: ${{ matrix.model == 'T2T1' && '0' || '1' }}
      # TODO: enable SD-related tests after fixing #4924
      # Disable authenticity test since it requires DISABLE_OPTIGA=0
      # Disable Evolu tests since they require Optiga
      # Disable telemetry test, fails because there's no battery
      # 5.5h pytest global timeout
      TT_UHUB_PORT: all
    timeout-minutes: 360  # 6h CI job timeout
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/environment
        with:
          nix-dev-shell: default
      - name: uhubctl
        run: |
          $UV_RUN core/tools/check-usb-permissions.py |& tee check-usb-permissions.log
          $NIX_RUN uhubctl
      - run: $UV_RUN make -C core build_firmware
      - run: $UV_RUN ci/hardware_tests/bootstrap.py "$TREZOR_MODEL" core/build/artifacts/latest/firmware.bin
      - run: |
          $UV_RUN trezorctl list
          $UV_RUN trezorctl get-features
        if: matrix.model != 'T3W1'  # gets stuck on models with THP
      - run: |
          $NIX_RUN bash -c "./tools/read-device-log.sh /dev/ttyTREZOR &> trezor.log" &
          TEST_FILTER='not test_authenticate_device and not evolu and not test_telemetry'
          if [ "$BITCOIN_ONLY" = "1" ]; then
            TEST_FILTER="$TEST_FILTER and not ward and not display_address"
          fi
          $UV_RUN pytest -v --verbose-log-file pytest.log tests/device_tests \
          -m 'not sd_card' -k "$TEST_FILTER" \
          --durations=50 --session-timeout 19800 --warn-on-gc-leak
      - run: tail -n50 trezor.log || true
        if: failure()
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # actions/upload-artifact@v7.0.0
        with:
          name: core-hardware-${{ matrix.model }}-${{ matrix.coins }}
          path: |
            trezor.log
            pytest.log
            check-usb-permissions.log
          retention-days: 7
        if: always()

  core_ward_channels:
    name: WARD wallet and service channels
    needs: param
    if: needs.param.outputs.ward_models != '[]'
    runs-on:
      - self-hosted
      - ${{ matrix.model == 'T3T1' && 'hw-t3t1' || 'hw-t3w1' }}
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.param.outputs.ward_models) }}
    timeout-minutes: 90
    env:
      TREZOR_MODEL: ${{ matrix.model }}
      BITCOIN_ONLY: 0
      WARD_SERVICE_CHANNEL: 1
      # DebugLink + WebAuthn + WARD fit; adding VCP would exceed the endpoint budget.
      DBG_CONSOLE: swo
      PYOPT: 0
      STORAGE_INSECURE_TESTING_MODE: 1
      BOOTLOADER_DEVEL: 1
      PYTEST_TIMEOUT: 120
      TT_UHUB_PORT: all
      WARDD_SUITE_DIR: ${{ github.workspace }}/ward-suite
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/environment
        with:
          nix-dev-shell: ward-hardware
      - name: Check out the matching WARD daemon
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          repository: trezor/trezor-suite
          ref: 64405ce6728d27444eb20e99ef0c412edcc8ac16
          path: ward-suite
          persist-credentials: false
      - name: Install wardd dependencies
        run: |
          $NIX_RUN node --version
          $NIX_RUN bash -e -c '
            cd ward-suite
            node .yarn/releases/yarn-4.18.0.cjs workspaces focus @trezor/wardd
          '
      - name: Check USB permissions
        run: |
          $UV_RUN core/tools/check-usb-permissions.py |& tee check-usb-permissions.log
          $NIX_RUN uhubctl
      - name: Build service-enabled firmware
        run: $UV_RUN make -C core build_firmware
      - name: Flash the test device
        id: flash_ward
        run: $UV_RUN ci/hardware_tests/bootstrap.py "$TREZOR_MODEL" core/build/artifacts/latest/firmware.bin
      - name: Native transport binding, idle polling and wallet coexistence
        run: |
          $UV_RUN pytest -v --junitxml=ward-transport.xml --verbose-log-file=ward-transport.log \
            --basetemp=ward-transport-tmp tests/device_tests/misc/test_ward_native_transport.py
      - name: WARD over the wallet channel with service unbound
        if: ${{ !cancelled() && steps.flash_ward.outcome == 'success' }}
        run: |
          $UV_RUN pytest -v --junitxml=ward-wallet.xml --verbose-log-file=ward-wallet.log \
            'tests/device_tests/misc/test_ward_service_channel.py::test_independent_service_and_wallet_fallback[mock-wallet-fallback]' \
            'tests/device_tests/misc/test_ward_service_channel.py::test_independent_service_and_wallet_fallback[http-wallet-fallback]'
      - name: WARD over the bound USB service channel
        if: ${{ !cancelled() && steps.flash_ward.outcome == 'success' }}
        run: |
          $UV_RUN pytest -v --junitxml=ward-service.xml --verbose-log-file=ward-service.log \
            'tests/device_tests/misc/test_ward_service_channel.py::test_independent_service_and_wallet_fallback[mock-service]' \
            'tests/device_tests/misc/test_ward_service_channel.py::test_independent_service_and_wallet_fallback[http-service]'
      - name: Native wardd USB connection
        if: ${{ !cancelled() && steps.flash_ward.outcome == 'success' }}
        run: |
          $UV_RUN pytest -v --junitxml=ward-native.xml --verbose-log-file=ward-native.log --basetemp=ward-native-tmp \
            tests/device_tests/misc/test_ward_service_channel.py::test_wardd_connects_directly_to_service_channel
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: ward-hardware-channels-${{ matrix.model }}
          path: |
            ward-wallet.xml
            ward-wallet.log
            ward-service.xml
            ward-service.log
            ward-native.xml
            ward-native.log
            ward-transport.xml
            ward-transport.log
            ward-transport-tmp/**/native-transport.log
            ward-native-tmp/**/wardd-native.log
            check-usb-permissions.log
          retention-days: 7

  core_monero_test:
    name: Monero tests
    needs: param
    runs-on:
      - self-hosted
      - ${{ matrix.model == 'T2B1' && 'hw-t2b1' || matrix.model == 'T3T1' && 'hw-t3t1' || matrix.model == 'T3B1' && 'hw-t3b1' || matrix.model == 'T3W1' && 'hw-t3w1' || 'hw-t2t1' }}
    timeout-minutes: 360
    if: needs.param.outputs.core_models != '[]' && false  # FIXME https://github.com/trezor/trezor-firmware/issues/3128
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.param.outputs.core_models) }}
    env:
      TREZOR_MODEL: ${{ matrix.model }}
      PYTEST_TIMEOUT: 1200
      PYOPT: 0
      DISABLE_OPTIGA: 1
      DISABLE_TROPIC: 1
      STORAGE_INSECURE_TESTING_MODE: 1
      BOOTLOADER_DEVEL: ${{ matrix.model == 'T2T1' && '0' || '1' }}
      TT_UHUB_PORT: all
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/environment
        with:
          nix-dev-shell: everything
      - run: $NIX_RUN uhubctl
      - run: $UV_RUN make -C core build_firmware
      - run: $UV_RUN ci/hardware_tests/bootstrap.py "$TREZOR_MODEL" core/build/artifacts/latest/firmware.bin
      - run: $UV_RUN trezorctl list
      - run: $UV_RUN trezorctl get-features
      - run: |
          $NIX_RUN bash -c "./tools/read-device-log.sh /dev/ttyTREZOR &> trezor.log" &
          $NIX_RUN ./core/tests/run_tests_device_emu_monero.sh --trezor-path webusb:
      - run: tail -n50 trezor.log || true
        if: failure()
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # actions/upload-artifact@v7.0.0
        with:
          name: core-hardware-monero-${{ matrix.model }}
          path: trezor.log
          retention-days: 7
        if: always()

  legacy_device_test:
    name: Device tests T1B1
    needs: param
    runs-on:
      - self-hosted
      - hw-t1b1
    timeout-minutes: 240
    if: needs.param.outputs.run_legacy == '1'
    strategy:
      fail-fast: false
      matrix:
        coins: [universal, btconly]
    env:
      PYTEST_TIMEOUT: 1200
      T1_UHUB_LOCATION: 3-1
      T1_UHUB_PORT: 2
      T1_CAMERA: /dev/video0  # camera device
      T1_ARDUINO_SERIAL: /dev/ttyTPMB  # arduino that pushes T1 buttons
      BITCOIN_ONLY: ${{ matrix.coins == 'universal' && '0' || '1' }}
      DEBUG_LINK: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/environment
        with:
          nix-dev-shell: default
      - name: uhubctl
        run: |
          $UV_RUN core/tools/check-usb-permissions.py |& tee check-usb-permissions.log
          $NIX_RUN uhubctl
      - run: $UV_RUN legacy/script/setup
      - run: $UV_RUN legacy/script/cibuild
        env:
          PRODUCTION: 0
      - run: $NIX_RUN ci/hardware_tests/t1_hw_test.sh
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # actions/upload-artifact@v7.0.0
        with:
          name: legacy-hardware-${{ matrix.coins }}
          path: |
            ci/hardware_tests/*.mp4
            check-usb-permissions.log
          retention-days: 7
        if: always()

  notify_scheduled_failure_to_slack:
    name: Notify Slack on nightly failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only nightly runs; manual runs are watched by whoever started them.
    if: failure() && github.event_name == 'schedule'
    needs: [core_device_test, core_ward_channels, core_monero_test, legacy_device_test]
    permissions:
      actions: read     # to list the jobs of this run
    steps:
      - name: Notify scheduled job failure to Slack
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_HW_TESTS_WEBHOOK }}
        run: |
          JOBS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100")
          # cancelled also covers jobs that hit timeout-minutes
          FAILED=$(jq -r '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "• <\(.html_url)|\(.name)>"' <<< "$JOBS")
          # count only test jobs; must match the name of the `param` job
          COUNTS=$(jq -r '[.jobs[] | select(.name != "Determine pipeline parameters" and .conclusion != null and .conclusion != "skipped")]
            | "\(map(select(.conclusion != "success")) | length) of \(length) jobs failed"' <<< "$JOBS")
          HEADER="Nightly hardware tests failed on \`$GITHUB_REF_NAME\` (<$COMMIT_URL|${COMMIT_SHA::10}>), $COUNTS: <$GITHUB_RUN_URL|GitHub run>"
          jq -n --arg header "$HEADER" --arg failed "$FAILED" \
            '{text: (if $failed == "" then $header else $header + "\n" + $failed end)}' \
            | curl -sSf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
