name: SDK

# Release-gating checks for the sdk/ tree: the `trezor-app-sdk` crate
# (sdk/crates/trezor-app-sdk), the no_std runtime library modular Trezor apps
# link against; the `trezor-app-tool` crate (sdk/crates/trezor-app-tool), the
# build/test/format driver for modular Trezor apps (invoked from sdk/apps as
# `cargo app-tool <cmd>`, or via `xtask apps <cmd>` from core/embed/xtask, which
# just spawns it); the `trezor-app-build` crate (sdk/crates/trezor-app-build),
# the build-script helpers the apps use for protobuf, translation and linker
# setup; and the extapps themselves (sdk/apps/*), which must build for
# both firmware and emulator targets. These must all pass before a release of
# either crate is cut. See sdk/doc/development.md for background on their roles.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize  # branch head update
      - labeled
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * *'  # every day @ 23:17
  push:
    branches:
      - 'release/**'
      - 'secfix/**'
    paths:
      - 'sdk/**'

# cancel any previous runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write       # for fetching the OIDC token (extapp UI report upload)
  contents: read        # for actions/checkout
  pull-requests: write  # for dflook comments on PR (extapp UI report comment)

env:
  # Read by the ./.github/actions/ui-comment composite action.
  PULL_COMMENT_PATH: ${{ github.workspace }}/tests/extapp-pull-comment.md

# The crate jobs (lint, test, deps_check) run over all crates, one step per crate.
jobs:
  param:
    name: Determine pipeline parameters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      extapp_test_lang: ${{ steps.set_vars.outputs.extapp_test_lang }}
    steps:
      - id: set_vars
        name: Set variables
        run: |
          echo extapp_test_lang=${{ (github.event_name == 'schedule' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'translations'))) && '[\"en\", \"cs\", \"fr\", \"de\", \"es\", \"id\", \"pt\"]' || '[\"en\"]' }} >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

  lint:
    name: Lint (fmt, clippy, doc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "cd sdk/crates/trezor-app-tool && cargo fmt --check && cargo clippy --all-targets -- -D warnings && RUSTDOCFLAGS='-D warnings' cargo doc --no-deps"
      - run: nix-shell --run "cd sdk/crates/trezor-app-build && cargo fmt --check && cargo clippy --all-targets -- -D warnings && RUSTDOCFLAGS='-D warnings' cargo doc --no-deps"
      - run: nix-shell --run "cd sdk/crates/trezor-app-sdk && cargo fmt --check && cargo clippy --no-default-features && cargo clippy --all-features && cargo doc --no-deps --all-features"

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "cd sdk/crates/trezor-app-tool && cargo test"
      - run: nix-shell --run "cd sdk/crates/trezor-app-build && cargo test"
      - run: nix-shell --run "cd sdk/crates/trezor-app-sdk && cargo test --features test"

  deps_check:
    name: Dependency check (audit, vet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "cd sdk/crates/trezor-app-tool && cargo audit && cargo vet --locked"
      - run: nix-shell --run "cd sdk/crates/trezor-app-build && cargo audit && cargo vet --locked"
      - run: nix-shell --run "cd sdk/crates/trezor-app-sdk && cargo audit && cargo vet --locked"

  extapp_firmware:
    name: extapp / Build firmware (${{ matrix.app }}, ${{ matrix.model }}, ${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [tron, testapp]
        model: [t3w1]
        lang: [en]
    env:
      EXTAPP: ${{ matrix.app }}
      EXTAPP_MODEL: ${{ matrix.model }}
      EXTAPP_LANG: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "uv run make extapp_build_firmware"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # actions/upload-artifact@v7.0.0
        with:
          name: extapp-firmware-${{ matrix.app }}-${{ matrix.model }}-${{ matrix.lang }}
          path: sdk/apps/target/artifacts/
          if-no-files-found: error
          retention-days: 7

  extapp_emu:
    name: extapp / Build emu (${{ matrix.app }}, ${{ matrix.model }}, ${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: param
    strategy:
      fail-fast: false
      matrix:
        app: [tron, testapp]
        model: [t3w1]
        lang: ${{ fromJSON(needs.param.outputs.extapp_test_lang) }}
        exclude:
          # testapp is only translated to English.
          - app: testapp
            lang: cs
          - app: testapp
            lang: fr
          - app: testapp
            lang: de
          - app: testapp
            lang: es
          - app: testapp
            lang: id
          - app: testapp
            lang: pt
    env:
      EXTAPP: ${{ matrix.app }}
      EXTAPP_MODEL: ${{ matrix.model }}
      EXTAPP_LANG: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "uv run make extapp_build_emu"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # actions/upload-artifact@v7.0.0
        with:
          name: extapp-emu-${{ matrix.app }}-${{ matrix.model }}-${{ matrix.lang }}
          path: sdk/apps/target/artifacts/
          if-no-files-found: error
          retention-days: 7

  extapp_unit_tests:
    name: extapp / Unit tests (${{ matrix.app }}, ${{ matrix.model }}, ${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [tron, testapp]
        model: [t3w1]
        lang: [en]
    env:
      EXTAPP: ${{ matrix.app }}
      EXTAPP_MODEL: ${{ matrix.model }}
      EXTAPP_LANG: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "uv run make extapp_unit_tests"

  extapp_device_test:
    name: extapp / Device tests (${{ matrix.app }}, ${{ matrix.model }}, ${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
      - param
      - extapp_emu
    strategy:
      fail-fast: false
      matrix:
        app: [tron, testapp]
        model: [t3w1]
        lang: ${{ fromJSON(needs.param.outputs.extapp_test_lang) }}
        exclude:
          # testapp is only translated to English.
          - app: testapp
            lang: cs
          - app: testapp
            lang: fr
          - app: testapp
            lang: de
          - app: testapp
            lang: es
          - app: testapp
            lang: id
          - app: testapp
            lang: pt
    env:
      EXTAPP: ${{ matrix.app }}
      EXTAPP_MODEL: ${{ matrix.model }}
      EXTAPP_LANG: ${{ matrix.lang }}
      # Core's own UI language for the device it drives -- independent of
      # EXTAPP_LANG, which is baked into the extapp binary at build time.
      TEST_LANG: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      # Core must be built universal (not btconly) so external-app support is
      # compiled in for this model, and with debug link enabled (PYOPT=0) so
      # the device tests can drive it. See core/Makefile's XTASK_BUILD_OPTS.
      - run: nix-shell --run "export TREZOR_MODEL=$(echo ${{ matrix.model }} | tr a-z A-Z); export BITCOIN_ONLY=0; export PYOPT=0; uv run make -C core build_unix"
      # testapp has no UI fixtures, so it runs without screenshot checks.
      - run: nix-shell --run "uv run make ${{ matrix.app == 'testapp' && 'extapp_test_emu' || 'extapp_test_emu_ui' }}"
      - uses: ./.github/actions/ui-report
        with:
          model: ${{ matrix.model }}
          lang: ${{ matrix.lang }}
          status: ${{ job.status }}
          app-root: sdk/apps/${{ matrix.app }}
          job-name: extapp_device_test_${{ matrix.app }}
        if: always()
        continue-on-error: true

  extapp_fmt_check:
    name: extapp / Style check (Rust, Python, translations)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "uv run make extapp_fmt_check"

  extapp_clippy:
    name: extapp / Clippy (${{ matrix.app }}, ${{ matrix.model }}, ${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [tron, testapp]
        model: [t3w1]
        lang: [en]
    env:
      EXTAPP: ${{ matrix.app }}
      EXTAPP_MODEL: ${{ matrix.model }}
      EXTAPP_LANG: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "uv run make extapp_clippy"

  extapp_vet:
    name: extapp / Dependency check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "make extapp_vet"

  # Post a comment with UI diff URLs, same idea as core_ui_comment in core.yml,
  # except the report columns are individual extapps rather than test types
  # (device_test, click_test, persistence_test) -- extapps only have device
  # tests today.

  extapp_ui_comment:
    name: extapp / Post comment with UI diff URLs
    # run UI comment job only for 'trezor/trezor-firmware' scheduled workflows and internal PRs (see #5381)
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.repository == 'trezor/trezor-firmware'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - param
      - extapp_device_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
      - run: sleep 1m  # try avoiding github api rate limit
      - run: |
          python ci/make_extapp_pull_comment.py "${{ github.run_id }}" '${{ needs.param.outputs.extapp_test_lang }}' > ${{ env.PULL_COMMENT_PATH }}
          cat ${{ env.PULL_COMMENT_PATH }} >> $GITHUB_STEP_SUMMARY
      - uses: ./.github/actions/ui-comment
        if: github.event_name == 'pull_request'
