name: SDK

# Release-gating checks for the `trezor-app-tool` crate
# (sdk/crates/trezor-app-tool), the build/test/format driver for modular Trezor
# apps (invoked from sdk/apps as `cargo app-tool <cmd>`, or via `xtask apps <cmd>`
# from core/embed/xtask, which just spawns it), and the `trezor-app-build` crate
# (sdk/crates/trezor-app-build), the build-script helpers the apps use for
# protobuf, translation and linker setup.
# See sdk/doc/development.md for background on their roles.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize  # branch head update
      - labeled
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * *'  # every day @ 23:17
  push:
    branches:
      - 'release/**'
      - 'secfix/**'
    paths:
      - 'sdk/**'

# cancel any previous runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read        # for actions/checkout

# Each job runs over all crates, one step per crate.
jobs:
  lint:
    name: Lint (fmt, clippy, doc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "cd sdk/crates/trezor-app-tool && cargo fmt --check && cargo clippy --all-targets -- -D warnings && RUSTDOCFLAGS='-D warnings' cargo doc --no-deps"
      - run: nix-shell --run "cd sdk/crates/trezor-app-build && cargo fmt --check && cargo clippy --all-targets -- -D warnings && RUSTDOCFLAGS='-D warnings' cargo doc --no-deps"

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "cd sdk/crates/trezor-app-tool && cargo test"
      - run: nix-shell --run "cd sdk/crates/trezor-app-build && cargo test"

  deps_check:
    name: Dependency check (audit, vet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "cd sdk/crates/trezor-app-tool && cargo audit && cargo vet --locked"
      - run: nix-shell --run "cd sdk/crates/trezor-app-build && cargo audit && cargo vet --locked"
