name: "[Bot] Tropic emulator reminder"

on:
  pull_request:
    types: [opened, closed, synchronize]
    branches: [main]
    paths:
      - tests/tropic_model/config.yml
      - vendor/ts-tvl

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # PULL_COMMENT_PATH: ${{ github.workspace }}/tropic-emulator-comment.md
  PULL_COMMENT: |
    You have modified Tropic configuration or submodule.
    You should not forget to do a thing.
  ISSUE_REPOSITORY: mmilata/misc
  ISSUE_TITLE: Tropic emulator config/version changed in trezor-firmware
  ISSUE_BODY: |
    Pull request: \$URL
  ISSUE_BODY_PATH: ${{ github.workspace }}/tropic-emulator-issue.md

jobs:
  pr_comment:
    name: Post a comment to the pull request
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    permissions:
      pull-requests: write  # needed to post a comment
    steps:
      - name: Find existing pull request comment
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad  # peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: ui-comment-${{ github.workflow_ref }}

      - name: Post a comment to the pull request
        if: steps.find-comment.outputs.comment-id == 0
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9  # peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ${{ env.PULL_COMMENT }}
            <!-- ui-comment-${{ github.workflow_ref }} -->
          # body-path: ${{ env.PULL_COMMENT_PATH }}
          edit-mode: replace

  issue_open:
    name: Open an issue for trezor-user-env
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && github.event.merged == false  # FIXME FIXME FIXME
    env:
      URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Write an issue to file
        run: |
          echo "${ISSUE_BODY}" > ${ISSUE_BODY_PATH}

      - name: Open the issue
        uses: peter-evans/create-issue-from-file@25d6828eccb16cebfc59d02b568639e7548970f2  # peter-evans/create-issue-from-file@v6
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          title: ${{ env.ISSUE_TITLE }}
          content-filepath: ${{ env.ISSUE_BODY_PATH }}
          #labels: |
          #  report
          #  automated issue
