name: 'UI report'
description: 'Prepare and upload HTML report of UI test results'
inputs:
  model:
    description: 'Internal model name'
    required: true
  lang:
    description: 'Firmware language code'
    required: true
  status:
    description: 'Either "success" or "failure"'
    required: false
    default: "failure"
  all-screens:
    description: 'Upload the screens of every test, not only those that match the fixtures (for tests that compare with their previous run)'
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set AWS credentials
      uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7  # aws-actions/configure-aws-credentials@v6.0.0
      with:
        role-to-assume: arn:aws:iam::538326561891:role/gh_actions_deploy_dev_firmware_data
        aws-region: eu-central-1
    - run: |
        OUTDIR=$GITHUB_RUN_ID
        mkdir -p $OUTDIR
        if [ "$ALL_SCREENS" = "true" ]; then
          $UV_RUN ci/prepare_ui_artifacts.py --all || true
        else
          $UV_RUN ci/prepare_ui_artifacts.py || true
        fi
        mv tests/ui_tests/reports/test/* $OUTDIR
        mv tests/ui_tests/fixtures.*.json $OUTDIR

        # rename all model/job-speficific report files, so they won't be overwritten during upload
        cd $OUTDIR
        for F in *; do
          # skip renaming since it has the same contents for all jobs
          if [ "$F" = "testreport.js" ]; then
            echo "Skip $F"
          elif [ -f "$F" ]; then
            mv $F $MODELJOB-$F
          fi
        done
        cd ..

        if [ "${INPUTS_STATUS}" = "success" ]; then
          cp .github/actions/ui-report/success.png $OUTDIR/$MODELJOB-status.png
        else
          cp .github/actions/ui-report/failure.png $OUTDIR/$MODELJOB-status.png
        fi
      shell: sh
      env:
        MODELJOB: "${{ inputs.model }}-${{ inputs.lang }}-${{ github.job }}"
        INPUTS_STATUS: ${{ inputs.status }}
        ALL_SCREENS: ${{ inputs.all-screens }}
    - name: Upload test results
      run: |
        # Cache s5cmd package (to be reused by the next calls)
        $NIX_RUN s5cmd version

        CMD="s5cmd --log error cp --concurrency 100"

        # Upload report
        du -sh $GITHUB_RUN_ID
        $NIX_RUN bash -c "$CMD $GITHUB_RUN_ID/ s3://data.trezor.io/dev/firmware/ui_report/$GITHUB_RUN_ID/" &
        PID1=$!

        # Upload test screen recording
        du -sh ci/ui_test_records
        $NIX_RUN bash -c "$CMD ci/ui_test_records/ s3://data.trezor.io/dev/firmware/ui_tests/" &
        PID2=$!
        # TODO: generate directory listing / autoindex

        # Wait for the above copy jobs to finish (fail if one of them fails)
        wait $PID1
        wait $PID2
      shell: sh
