name: 'Build core emulator'
description: 'Build, upload to S3, and store core emulator artifact'
inputs:
  model:
    description: 'Trezor model'
    required: true
  version:
    description: 'Version string'
    required: true
  artifact-name:
    description: 'Artifact name'
    required: true
  binary-suffix:
    description: 'Binary suffix appended to version, e.g. -arm'
    required: false
    default: ''
  build-bootloader:
    description: 'Build bootloader before unix emulator build'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - uses: $/.github/actions/environment

    - run: $UV_RUN make -C core build_bootloader_emu
      if: inputs.build-bootloader == 'true'
      shell: sh
      env:
        TREZOR_MODEL: "${{ inputs.model }}"

    - run: $UV_RUN make -C core build_unix_frozen
      shell: sh
      env:
        TREZOR_MODEL: "${{ inputs.model }}"

    - id: prepare_binary
      run: |
        TARGET="core/build/artifacts/latest/trezor-emu-core-${INPUTS_MODEL}-v${INPUTS_VERSION}${INPUTS_BINARY_SUFFIX}"
        mv core/build/artifacts/latest/firmware-emu "$TARGET"
        echo "binary_path=$TARGET" >> "$GITHUB_OUTPUT"
      shell: sh
      env:
        INPUTS_MODEL: ${{ inputs.model }}
        INPUTS_VERSION: ${{ inputs.version }}
        INPUTS_BINARY_SUFFIX: ${{ inputs.binary-suffix }}

    - name: Configure aws credentials
      if: github.repository == 'trezor/trezor-firmware'
      uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7  # aws-actions/configure-aws-credentials@v6.0.0
      with:
        role-to-assume: arn:aws:iam::538326561891:role/gh_actions_deploy_dev_firmware_data
        aws-region: eu-west-1

    - name: Upload emulator binaries
      if: github.repository == 'trezor/trezor-firmware'
      run: |
        aws s3 cp "${STEPS_PREPARE_BINARY_OUTPUTS_BINARY_PATH}" "s3://data.trezor.io/dev/firmware/releases/emulators-new/${INPUTS_MODEL}/"
      shell: sh
      env:
        STEPS_PREPARE_BINARY_OUTPUTS_BINARY_PATH: ${{ steps.prepare_binary.outputs.binary_path }}
        INPUTS_MODEL: ${{ inputs.model }}

    - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # actions/upload-artifact@v7.0.0
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          core/build/artifacts/latest/trezor-emu-core*
          core/build/artifacts/latest/bootloader-emu
        retention-days: 7
