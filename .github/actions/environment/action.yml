name: 'Download dependencies'
description: 'Nixpkgs and uv'
inputs:
  nix-dev-shell:
    description: 'Nix flake devShells output attribute to use'
    required: false
    default: "minimal"
    type: "choice"
    options:
      - "minimal"
      - "default"
      - "everything"
  pre-download:
    description: 'Download shell.nix and uv.lock dependencies upfront?'
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Show disk usage
      shell: sh
      run: |
        df -h /
    - name: Install nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # cachix/install-nix-action@v31.11.3
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: Enable flakes if nix was already installed
      shell: sh
      run: |
        mkdir -p ~/.config/nix
        grep --quiet experimental-features ~/.config/nix/nix.conf || echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
    - name: Set convenience variables
      run: | # zizmor: ignore[github-env,template-injection] nix-dev-shell is choice of hardcoded options
        echo NIX_RUN="nix develop .#${{ inputs.nix-dev-shell }} --command" >> $GITHUB_ENV
        echo UV_RUN="nix develop .#${{ inputs.nix-dev-shell }} --command uv run" >> $GITHUB_ENV
        cat $GITHUB_ENV
      shell: sh
    - name: Dependencies nixpkgs
      if: inputs.pre-download == 'true'
      run: timeout -v --kill-after=10 500 $NIX_RUN echo nixpkgs deps preinstalled || echo "NIXPKGS PREINSTALL FAILURE"
      shell: sh
    - name: Dependencies uv
      if: inputs.pre-download == 'true'
      run: timeout -v --kill-after=10 500 $NIX_RUN uv sync
      shell: sh
