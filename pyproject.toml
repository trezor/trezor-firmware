[project]
name = "trezor-firmware"
version = "0.0.0"
description = ""
authors = [{ name = "SatoshiLabs", email = "info@satoshilabs.com" }]
requires-python = ">=3.10,<4"
dependencies = [
    "trezor",
    "tvl",
    "protobuf==6.33.5",  # minor needs to be >= than version in shell.nix
    "nanopb>=0.4.3,<0.5",
    "pytest>=9.0.3,<10",
    "coverage==7.13.5",
    "pytest-ordering",
    "pytest-random-order",
    "pytest-timeout",
    "pytest-xdist",
    "tox",
    "dominate",
    "pyserial",
    "mnemonic>=0.21,<0.22",
    "shamir-mnemonic>=0.3.0,<0.4",
    "slip10>=1.0.1,<2",
    "fido2>=0.8.0,<0.9",
    "python-bitcoinlib>=0.11.0,<0.12",
    "typing-extensions>=4.7.1",
    "flake8>=7",
    "mako>=1.3.10,<2",
    "munch>=4,<5",
    "autoflake",
    "flake8-requirements>=2.1.0",
    "pylint~=3.3",
    "demjson3",
    "graphviz",
    "click>=8,<9",
    "requests~=2.32",
    "termcolor",
    "Pillow>=11",
    "ecdsa>=0.16,<0.20",
    "pyasn1",
    "noiseprotocol>=0.3.1,<0.4",
    "west>=1.4.0,<2",
    "intelhex==2.3.0",
    "imgtool==2.2.0",
    "setuptools>=24.2.0",
    "cryptography",
    "hypothesis",
    "inotify",
    "yamllint>=1.25.0,<2",
    "vulture~=2.6",
    "binsize>=0.1.3,<0.2",
    "toiftool ; python_version >= '3.8'",
    "trezor-pylint-plugin",
    "trezor-core-tools",
    "pyelftools>=0.32,<0.33",
    "pytest-retry>=1.7.0,<2",
    "slh-dsa>=0.1.3,<0.2",
    "bleak>=1.1.0",
    "construct-typing>=0.7.0",
    "flake8-annotations>=3.1.1,<4",
]

[dependency-groups]
dev = [
    "scan-build",
    "towncrier>=23.6.0,<24",
    "wheel>0.45",
]

[tool.uv]
package = false
exclude-newer = "30 days"

[tool.uv.sources]
trezor = { path = "./python", editable = true }
tvl = { path = "./vendor/ts-tvl", editable = true }
toiftool = { path = "./python/tools/toiftool", editable = true }
trezor-pylint-plugin = { path = "./tools/trezor-pylint-plugin", editable = true }
trezor-core-tools = { path = "./core/tools", editable = true }

# Ruff replaces `isort` and `black` (import sorting, formatting) and enforces
# the PEP 585/604 annotation style. All other Python style checks are still
# handled by flake8 / pylint -- see setup.cfg and .pylintrc.
# The set of files to lint is not configured here -- the Makefiles pass it in,
# so that ruff covers exactly what every other style tool covers
# (tools/style.py.include, python/Makefile).
[tool.ruff]
target-version = "py310"
# `python` is a published library that still supports 3.9 (see python/pyproject.toml)
per-file-target-version = { "python/**/*.py" = "py39" }

[tool.ruff.lint]
select = [
    # isort
    "I",
    # PEP 585
    "UP006",  # non-pep585-annotation: typing.Tuple -> tuple, typing.Type -> type, ...
    "UP035",  # deprecated-import: typing.Sequence -> collections.abc.Sequence, ...

    # PEP 604 (used in /core only)
    "UP007",  # non-pep604-annotation-union: Union[int, str] -> int | str
    "UP045",  # non-pep604-annotation-optional: Optional[str] -> str | None
]

[tool.ruff.lint.isort]
extra-standard-library = [
  "buffer_types",
  "micropython",
  "uctypes",
  "utime",
  "timeq",
  "trezorio",
  "trezorui",
  "trezorutils",
  "trezorconfig",
  "trezorcrypto",
  "vfs",
]
# `python` is needed for `from python.src.storage import ...` in storage tests
known-first-party = ["trezorlib", "apps", "coin_info", "marketcap", "ui_tests", "python"]
known-third-party = ["trezor", "storage"]

[tool.ruff.lint.per-file-ignores]
# PEP 604 syntax needs Python 3.10 - cannot be enforced e.g. in /python as it still supports Python 3.9.
"!core/**/*.py" = ["UP007", "UP045"]
