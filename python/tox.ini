[tox]
envlist =
    py{39,310,311,312,313,314}-{minimal,default,full}
    # hidapi has no wheels for Python 3.15+
    py315-{minimal,default,full_without_hidapi}
    # click >=8.2 requires Python 3.10+
    py39-click8{0,1}
    py{310,311,312,313,314,315}-click8{0,1,2,3,4,5}

# workaround https://github.com/tox-dev/tox/pull/3966
skip_missing_interpreters = false

[testenv]
runner = uv-venv-runner
dependency_groups =
    !minimal: dev
extras =
    full: full
    full_without_hidapi: full-without-hidapi
commands =
    # Working in the local directory, try to compile all bytecode
    python -m compileall src tests
    # Smoke-test trezorctl
    trezorctl --help
    # Run test suite
    !minimal: pytest -c setup.cfg --random-order tests

[testenv:py{39,310,311,312,313,314,315}-click{80,81,82,83,84,85}]
commands =
    click80: uv pip install "click>=8.0,<8.1"
    click81: uv pip install "click>=8.1,<8.2"
    click82: uv pip install "click>=8.2,<8.3"
    click83: uv pip install "click>=8.3,<8.4"
    click84: uv pip install "click>=8.4,<8.5"
    click85: uv pip install "click>=8.5,<8.6"
    # Smoke-test trezorctl
    trezorctl --version
