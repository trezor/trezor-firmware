[pytest]
testpaths = tests
addopts = -ra -p no:cacheprovider
log_cli = true
log_cli_level = INFO
# A hung test dumps every thread's stack and fails instead of waiting forever
# (pytest-timeout); the longest flows (migration, nRF pushes) take ~10 min.
timeout = 1800
timeout_method = thread
markers =
    offline: checks the fixture set on the host; needs no device
    hw: flashes and drives a T3W1 on the bench (needs --hw)
    operator: needs a person at the device (needs --operator, run with -s)
    burns: moves a forward-only counter; the next baseline's flash-erase resets it
    cut: resets the unit at a breakpoint over SWD; holds the ST-Link meanwhile (no screenshots)
