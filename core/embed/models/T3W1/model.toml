mcu = "stm32u5g"
default_board = "revC"
secmon = true
bootloader_header_tool = "headertool_pq"

features = [
    "backup_ram",
    "boot_ucb",
    "dma2d",
    "hash_processor",
    "hw_jpeg_decoder",
    "hw_revision",
    "iwdg",
    "lockable_bootloader",
    "mcu_attestation",
    "pq_secure_boot",
    "rtc",
    "secmon_header",
    "secmon_layout",
    "secmon_verification",
    "secret",
    "secure_aes",
    "serial_number",
    "smp",
    "framebuffer",
    "suspend",
    "tamper",
    "telemetry",
    "thp",
    "touch_wakeup",
    "layout_eckhart",
    "display_rgba8888",
]

# Under pq_secure_boot the bootloader pushes the nRF firmware (workflow_nrf_ota)
# and the kernel does not need SMP. Restore `smp` if pq_secure_boot is dropped.
[project_overrides.kernel]
exclude = ["smp"]
