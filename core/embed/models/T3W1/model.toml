mcu = "stm32u5g"
default_board = "revC"
secmon = true
bootloader_header_tool = "headertool_pq"

features = [
    "backup_ram",
    "boot_ucb",
    "dma2d",
    "hash_processor",
    "hw_jpeg_decoder",
    "hw_revision",
    "iwdg",
    "lockable_bootloader",
    "mcu_attestation",
    "pq_secure_boot",
    "rtc",
    "secmon_header",
    "secmon_layout",
    "secmon_verification",
    "secret",
    "secure_aes",
    "serial_number",
    "smp",
    "framebuffer",
    "suspend",
    "tamper",
    "telemetry",
    "thp",
    "touch_wakeup",
    "layout_eckhart",
    "display_rgba8888",
]

# The SMP serial-recovery transport exists to push firmware to the nRF. Under
# `pq_secure_boot` the BOOTLOADER does that (workflow_nrf_ota), so the kernel
# has no use for it -- and while `smp` is present it still brings up the nRF
# UART and its interrupt on every boot. Keep this coupled to `pq_secure_boot`
# above: a build that drops the feature needs `smp` back, because then the
# firmware is the only thing that can update the nRF.
[project_overrides.kernel]
exclude = ["smp"]
