mcu = "stm32h5f5"
default_board = "dk"
secmon = true
bootloader_header_tool = "headertool_pq"

features = [
    "boot_ucb",
    "hash_processor",
    "lockable_bootloader",
    "secmon_header",
    "secmon_layout",
    "secmon_verification",
    "secret",
    "secure_aes",
    "tamper",
    "layout_bolt",
]
