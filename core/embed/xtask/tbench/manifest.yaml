models:
  - id: t3w1
    name: T3W1
    artifactFolder: T3W1
  - id: t3t1
    name: T3T1
    artifactFolder: T3T1
  - id: t3b1
    name: T3B1
    artifactFolder: T3B1
  - id: t2b1
    name: T2B1
    artifactFolder: T2B1
  - id: t2t1
    name: T2T1
    artifactFolder: T2T1
  - id: d001
    name: D001
    artifactFolder: D001
  - id: d002
    name: D002
    artifactFolder: D002

targets:
  - id: hardware
    name: Hardware
    shortName: HW
    flag: null
    executableExtension: .elf
  - id: emulator
    name: Emulator
    shortName: EMU
    flag: --emulator
    artifactSuffix: -emu

components:
  - id: firmware
    name: Firmware
    artifactName: firmware
    uploadWhen: target(hardware)
    debug:
      - name: Emu - Firmware
        when: target(emulator)
        template: emu-firmware.json
      - name: F4 - Firmware (Kernel)
        when: all(target(hardware), any(model(t2b1), model(t2t1), model(d001)))
        template: f4-kernel+coreapp.json
      - name: U5 - Firmware (Kernel)
        when: all(target(hardware), any(model(t3b1), model(t3t1), model(t3w1), model(d002)))
        template: u5-kernel+coreapp.json
      - name: U5 - Firmware (Extapp)
        when: all(target(hardware), any(model(t3w1)))
        template: u5-kernel+coreapp+extapp.json
      - name: U5 - Firmware  (Secmon)
        when: all(target(hardware), any(model(t3w1), model(d002)))
        template: u5-secmon+kernel+coreapp.json

  - id: prodtest
    name: ProdTest
    artifactName: prodtest
    uploadWhen: target(hardware)
    debug:
      - name: Emu - Prodtest
        when: target(emulator)
        template: emu-generic.json
      - name: F4 - Prodtest
        when: all(target(hardware), any(model(t2b1), model(t2t1), model(d001)))
        template: f4-generic.json
      - name: U5 - Prodtest
        when: all(target(hardware), any(model(t3b1), model(t3t1), model(t3w1), model(d002)))
        template: u5-generic.json

  - id: bootloader
    name: Bootloader
    artifactName: bootloader
    flashWhen: target(hardware)
    debug:
      - name: Emu - Bootloader
        when: target(emulator)
        template: emu-generic.json
      - name: F4 - Bootloader
        when: all(target(hardware), any(model(t2b1), model(t2t1), model(d001)))
        template: f4-generic.json
      - name: U5 - Bootloader
        when: all(target(hardware), any(model(t3b1), model(t3t1), model(t3w1), model(d002)))
        template: u5-generic.json

  - id: bootloader_ci
    name: Bootloader CI
    artifactName: bootloader_ci
    flashWhen: target(hardware)
    debug:
      - name: Emu - Bootloader CI
        when: target(emulator)
        template: emu-generic.json
      - name: F4 - Bootloader CI
        when: all(target(hardware), any(model(t2b1), model(t2t1), model(d001)))
        template: f4-generic.json
      - name: U5 - Bootloader CI
        when: all(target(hardware), any(model(t3b1), model(t3t1), model(t3w1), model(d002)))
        template: u5-generic.json

  - id: boardloader
    name: Boardloader
    artifactName: boardloader
    flashWhen: target(hardware)
    debug:
      - name: Emu - Boardloader
        when: target(emulator)
        template: emu-generic.json
      - name: F4 - Boardloader
        when: all(target(hardware), any(model(t2b1), model(t2t1), model(d001)))
        template: f4-generic.json
      - name: U5 - Boardloader
        when: all(target(hardware), any(model(t3b1), model(t3t1), model(t3w1), model(d002)))
        template: u5-generic.json

options:
  - id: btc-only
    name: Bitcoin Only
    description: Bitcoin-only firmware, no altcoins.
    when: component(firmware)
    group: Features
    type: checkbox

  - id: bootloader-devel
    name: Development Bootloader
    description: Uses the development bootloader.
    when: all(target(hardware))
    type: checkbox
    group: Features

  - id: unsafe-fw
    name: Unsafe Firmware
    description: Enables unsafe firmware features.
    when: all(target(hardware), component(firmware))
    type: checkbox
    group: Features

  - id: production
    name: Production
    description: Builds a production-signed firmware image.
    type: checkbox
    group: Features

  - id: force-bootloader-upgrade
    name: Force Bootloader Upgrade
    description: Forces a bootloader upgrade.
    when: all(target(hardware), component(firmware))
    type: checkbox
    group: Features

  - id: apps
    name: External Apps Support
    description: Enables external app loading.
    group: Features
    when: component(firmware)
    type: checkbox

  - id: n4w1
    name: N4W1 Support
    description: Enables N4W1 support.
    group: Features
    when: component(firmware)
    type: checkbox

  - id: debug
    name: Debug Build
    description: Enables debug symbols and disables some optimizations.
    group: Debugging
    type: checkbox

  - id: pyopt
    name: MicroPython Optimization
    description: Enables MicroPython bytecode optimization.
    group: Debugging
    when: component(firmware)
    type: checkbox

  - id: source-lines
    name: Embed Source Lines
    description: Enables inclusion of MicroPython source lines.
    group: Debugging
    when: component(firmware)
    type: checkbox

  - id: frozen
    name: Frozen Modules
    description: Embeds frozen MicroPython modules.
    group: Debugging
    when: component(firmware)
    type: checkbox

  - id: benchmark
    name: Benchmark
    description: Includes crypto benchmarks.
    group: Debugging
    when: component(firmware)
    type: checkbox

  - id: log-stack-usage
    name: Log Stack Usage
    description: Logs stack usage.
    when: component(firmware)
    group: Debugging
    type: checkbox

  - id: block-on-vcp
    name: Blocking USB VCP
    description: Uses blocking writes on VCP.
    when: not(component(boardloader))
    group: Debugging
    type: checkbox

  - id: dbg-console
    name: Debug Console
    description: Selects the debug console backend.
    group: Debugging
    type: multistate
    states:
      - value: none
        name: None
        description: Disable the debug console.
      - value: vcp
        name: VCP
        description: Route the debug console over virtual COM port.
      - value: swo
        name: SWO
        description: Route the debug console over SWO.
      - value: system-view
        name: SystemView
        description: Route the debug console over SEGGER SystemView.

  - id: debug-link
    name: Debug Link
    description: Enable debug link support.
    group: Debugging
    when: any(component(firmware), component(bootloader))
    type: checkbox

  - id: perf-overlay
    name: Performance Overlay
    description: Shows the UI performance overlay.
    group: Debugging
    when: not(any(component(boardloader), component(bootloader_ci)))
    type: checkbox

  - id: disable-animation
    name: Disable Animation
    description: Disables UI animations.
    group: Debugging
    when: any(component(firmware), component(bootloader))
    type: checkbox

  - id: disable-optiga
    name: Disable OPTIGA
    description: Disables OPTIGA support.
    when: component(firmware)
    group: Debugging
    type: checkbox

  - id: disable-tropic
    name: Disable TROPIC
    description: Disables TROPIC support.
    when: component(firmware)
    group: Debugging
    type: checkbox

  - id: storage-insecure-testing-mode
    name: Insecure Storage Testing
    description: Enables insecure storage test mode.
    group: Debugging
    when: component(firmware)
    type: checkbox
