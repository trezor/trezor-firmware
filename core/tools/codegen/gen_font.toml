# Fonts generated by gen_font.py, grouped by layout.
#
# Each entry renders `fonts/<name>-<style>.{otf,ttf}` at `size` pixels into
# `embed/rust/src/ui/layout_<layout>/fonts/font_<name>_<style>_<size>.rs` (ASCII glyphs)
# and `translations/fonts/<layout>/font_<name>_<style>_<size>[_upper]_<lang>.json`
# (foreign glyphs, part of the translation blobs).
#
# Keys:
#   name, style, size  font file and pixel size
#   bpp                bits per pixel (default 4)
#   shave_x            columns of left bearing removed from each glyph (default 0)
#   kerning            generate kerning data (default false)
#   font_idx           translation blob index; generates `Font_*_info` with all glyphs
#   font_idx_upper     translation blob index; generates `Font_*_upper_info` showing
#                      lowercase letters as uppercase
#   nums_only          also generate `Font_*_NumsOnly_info` with only digits and space
#                      (uses `font_idx`)
#   ascii_subset       ASCII characters included in the Rust file; uppercase letters
#                      fall back to lowercase, the rest to the nonprintable glyph
#   features           OpenType features applied to all glyphs (e.g. "tnum")
#   max_advance        upper limit of glyph advances
#   min_spacing        minimal number of empty columns after each glyph
#   bitmaps            hand-drawn glyph bitmaps ('#' = pixel on)
#   notes              written as `// NOTE:` comments into the Rust file

# ---------------------------------------------------------------------------
# Bolt
# ---------------------------------------------------------------------------

[[bolt]]
name = "TTHoves"
style = "Regular"
size = 21
font_idx = 1

[[bolt]]
name = "TTHoves"
style = "DemiBold"
size = 21
font_idx = 5

[[bolt]]
name = "TTHoves"
style = "Bold"
size = 17
font_idx_upper = 7

[[bolt]]
name = "RobotoMono"
style = "Medium"
size = 20
font_idx = 3

# ---------------------------------------------------------------------------
# Caesar
# ---------------------------------------------------------------------------

[[caesar]]
name = "PixelOperator"
style = "Regular"
size = 8
bpp = 1
shave_x = 1
font_idx = 1
font_idx_upper = 6

[[caesar]]
name = "PixelOperator"
style = "Bold"
size = 8
bpp = 1
shave_x = 1
font_idx = 2
font_idx_upper = 7

[[caesar]]
name = "PixelOperatorMono"
style = "Regular"
size = 8
bpp = 1
shave_x = 1
font_idx = 3
max_advance = 7
notes = [
    "advances limited to 7 (e.g. to have 9px space between words)",
    "narrower hand-drawn bitmaps of \"_\", \"M\", \"W\", \"m\" and \"w\"",
]

[caesar.bitmaps]
"_" = ["#######"]
M = [
    "#...#",
    "##.##",
    "#.#.#",
    "#...#",
    "#...#",
    "#...#",
    "#...#",
]
W = [
    "#...#",
    "#...#",
    "#.#.#",
    "#.#.#",
    "#.#.#",
    "#.#.#",
    ".#.#.",
]
m = [
    "##.#.",
    "#.#.#",
    "#.#.#",
    "#...#",
    "#...#",
]
w = [
    "#...#",
    "#...#",
    "#.#.#",
    "#.#.#",
    ".#.#.",
]

[[caesar]]
name = "Unifont"
style = "Regular"
size = 16
bpp = 1
shave_x = 1
font_idx = 4
min_spacing = 1
notes = ["advances of wide glyphs increased so that they do not touch the following one"]

# Unifont Bold does not seem to have czech characters
[[caesar]]
name = "Unifont"
style = "Bold"
size = 16
bpp = 1
shave_x = 1
font_idx = 5

