# Board-scoped sysbuild overlay for the nRF54L series (NCS 3.3).
#
# The nRF54L series defaults the ed25519 image hash to SHA512; override it to
# SHA256. sysbuild's CMakeLists reads SB_CONFIG_BOOT_IMG_HASH_ALG_SHA512 and
# injects CONFIG_BOOT_IMG_HASH_ALG_SHA512=y into MCUboot, overriding
# sysbuild/mcuboot.conf. Setting it to n here lets CONFIG_BOOT_IMG_HASH_ALG_SHA256=y
# in mcuboot.conf win.
#
# This lives in a board-scoped overlay (not sysbuild.conf) because the symbol
# does not exist on nRF52832 / NCS 2.9 - assigning it there aborts the build
# with an "undefined symbol" Kconfig warning.
SB_CONFIG_BOOT_IMG_HASH_ALG_SHA512=n

# NOTE: SB_CONFIG_MCUBOOT_HARDWARE_DOWNGRADE_PREVENTION is deliberately NOT set.
# It looks like the way to provision the counter slots, and it is what drives
# nrf/cmake/sysbuild/provision_hex.cmake -- but that cmake cannot handle this
# configuration. With SB_CONFIG_PARTITION_MANAGER=n it resolves
# s0_partition/s1_partition as REQUIRED before it ever considers the mcuboot-only
# case, so enabling it fails at configure time with
#
#     dt_partition_addr: Unable to find a node with label: s0_partition
#
# on a layout that has no NSIB/B0 slots. It also pulls in b0_gen_keys and an NSIB
# signing key we have no use for.
#
# provision.py supports us directly (--mcuboot-only, documented as "MCUboot is
# present, but NSIB is not"), so build_sign_flash.sh generates the provision page
# and merges it into the flashed hex instead. See MCUBOOT_COUNTER_SLOTS there.
