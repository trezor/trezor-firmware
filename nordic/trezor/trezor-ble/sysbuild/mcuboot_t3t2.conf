# Board-scoped MCUboot config for t3t2_dk (nRF54L / NCS 3.3).
#
# MUST NOT be merged for t3w1: CONFIG_BOOT_PQ_SECURE_BOOT only exists in the NCS 3.3
# MCUboot revision (trezor-ncs3.3.0), and assigning an undefined symbol aborts the
# Kconfig run -- the same trap documented for SB_CONFIG_BOOT_IMG_HASH_ALG_SHA512.
# T3W1 is frozen on NCS 2.9 for certification and keeps the LEGACY image-hash
# Ed25519 signing scheme, so it must not get this.

# Verify the image against the Trezor founder Merkle tree (post-quantum): the image
# is a leaf under modelRoot, and the founder's hybrid signature over modelRoot
# (SLH-DSA + Ed25519, 2-of-3) is the SAME one the STM boot header carries. Replaces
# the image-hash Ed25519 signatures, which are neither emitted nor consulted here.
CONFIG_BOOT_PQ_SECURE_BOOT=y

# Rollback protection for the founder-verified image, enforced at boot. Closes the
# serial-recovery downgrade path: MCUboot's own MCUBOOT_HW_ROLLBACK_PROT only acts
# on the swap decision, which SINGLE_APPLICATION_SLOT never makes.
#
# The counter lives in NSIB's provision page (bl_storage), whose node NCS does not
# define for nRF54LS05B -- supplied by sysbuild/mcuboot/boards/<board>.overlay, and
# provisioned by SB_CONFIG_MCUBOOT_HARDWARE_DOWNGRADE_PREVENTION in
# sysbuild_nrf54l.conf. Both are nRF54L-scoped; T3W1 is unaffected.
#
# NOT yet validated on hardware: the UICR offset follows the family convention but
# LS05B's own UICR usage has not been confirmed. If the counter misbehaves, this is
# the first thing to suspect -- ERASEALL clears UICR on a devkit.
CONFIG_BOOT_PQ_ROLLBACK_PROT=y
CONFIG_SECURE_BOOT_STORAGE=y
CONFIG_SECURE_BOOT_CRYPTO=y
# NOTE: CONFIG_MCUBOOT_HW_DOWNGRADE_PREVENTION is deliberately NOT set. It is what
# compiles NCS's nrf_nv_counters.c, the adapter exposing bl_storage through
# MCUboot's boot_nv_security_counter_* API -- but that file declares those
# functions returning fih_int where bootutil/security_cnt.h declares fih_ret. Those
# coincide only with FIH off; under FIH_ENABLE_DOUBLE_VARS (profile MEDIUM, which
# mcuboot.conf sets) fih_int is a struct and fih_ret a volatile int, so it does not
# compile. image_validate.c calls NSIB's plain-C get/set_monotonic_counter directly
# instead, which also avoids MCUBOOT_HW_ROLLBACK_PROT's swap-time machinery -- inert
# here, since SINGLE_APP never makes a swap decision.
