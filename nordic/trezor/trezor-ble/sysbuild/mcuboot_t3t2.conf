# MCUboot config for t3t2_dk (nRF54L / NCS 3.3). Never merge for t3w1: these
# symbols do not exist in the NCS 2.9 MCUboot and an undefined symbol aborts
# the Kconfig run.

# Verify the image against the founder Merkle tree instead of Ed25519 image
# signatures; see docs/core/embed-arch/firmware-merkle-tree.md.
CONFIG_BOOT_PQ_SECURE_BOOT=y

# Boot-time rollback protection (MCUBOOT_HW_ROLLBACK_PROT only acts on the swap
# decision, which SINGLE_APPLICATION_SLOT never makes). The counter lives in
# NSIB's bl_storage page: node from sysbuild/mcuboot_t3t2.overlay, page
# generated by build_sign_flash.sh and needed in factory flash (OTA never
# writes it). TODO: not yet validated on hardware (LS05B UICR offset).
CONFIG_BOOT_PQ_ROLLBACK_PROT=y
CONFIG_SECURE_BOOT_STORAGE=y
CONFIG_SECURE_BOOT_CRYPTO=y
# CONFIG_MCUBOOT_HW_DOWNGRADE_PREVENTION deliberately not set: nrf_nv_counters.c
# does not compile under FIH_ENABLE_DOUBLE_VARS (fih_int vs fih_ret).
