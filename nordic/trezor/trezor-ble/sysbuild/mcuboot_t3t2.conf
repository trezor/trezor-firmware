# Board-scoped MCUboot config for t3t2_dk (nRF54L / NCS 3.3).
#
# MUST NOT be merged for t3w1: CONFIG_BOOT_PQ_SECURE_BOOT only exists in the NCS 3.3
# MCUboot revision (trezor-ncs3.3.0), and assigning an undefined symbol aborts the
# Kconfig run -- the same trap documented for SB_CONFIG_BOOT_IMG_HASH_ALG_SHA512.
# T3W1 is frozen on NCS 2.9 for certification and keeps the LEGACY image-hash
# Ed25519 signing scheme, so it must not get this.

# Verify the image against the Trezor founder Merkle tree (post-quantum): the image
# is a leaf under modelRoot, and the founder's hybrid signature over modelRoot
# (SLH-DSA + Ed25519, 2-of-3) is the SAME one the STM boot header carries. Replaces
# the image-hash Ed25519 signatures, which are neither emitted nor consulted here.
CONFIG_BOOT_PQ_SECURE_BOOT=y
