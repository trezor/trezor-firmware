# Board-scoped MCUboot config for t3t2_dk (nRF54L / NCS 3.3).
#
# MUST NOT be merged for t3w1: CONFIG_BOOT_PQ_SECURE_BOOT only exists in the NCS 3.3
# MCUboot revision (trezor-ncs3.3.0), and assigning an undefined symbol aborts the
# Kconfig run -- the same trap documented for SB_CONFIG_BOOT_IMG_HASH_ALG_SHA512.
# T3W1 is frozen on NCS 2.9 for certification and keeps the LEGACY image-hash
# Ed25519 signing scheme, so it must not get this.

# Verify the image against the Trezor founder Merkle tree (post-quantum): the image
# is a leaf under modelRoot, and the founder's hybrid signature over modelRoot
# (SLH-DSA + Ed25519, 2-of-3) is the SAME one the STM boot header carries. Replaces
# the image-hash Ed25519 signatures, which are neither emitted nor consulted here.
CONFIG_BOOT_PQ_SECURE_BOOT=y

# Rollback protection for the founder-verified image, enforced at boot. Closes the
# serial-recovery downgrade path: MCUboot's own MCUBOOT_HW_ROLLBACK_PROT only acts
# on the swap decision, which SINGLE_APPLICATION_SLOT never makes.
#
# OFF pending a provisioning decision -- the code is in place (mcuboot
# CONFIG_BOOT_PQ_ROLLBACK_PROT, default n) but the counter has nowhere to live yet.
# It selects SECURE_BOOT_STORAGE, whose bl_storage.c resolves its base address from
# the devicetree:
#
#     #define BL_STORAGE_ADDRESS DT_REG_ADDR(DT_NODELABEL(bl_storage))
#
# nRF54L05/L10/L15 get that node from <soc>_cpuapp_partition.dtsi as
# `bl_storage: uicr@500 { reg = <0x500 0x460>; }`, with `ranges` on the parent
# &uicr. The nRF54LS05B has no such partition dtsi: it has a uicr node
# (nrf54ls05_a_b.dtsi, 0xffd000) but no `ranges` and no bl_storage child, so
# enabling this fails the build with
# 'DT_N_NODELABEL_bl_storage_REG_IDX_0_VAL_ADDRESSU undeclared'.
#
# Turning it on therefore needs an overlay that picks a UICR offset for the
# provision page. Do NOT copy 0x500 from the other 54L parts on the assumption it
# generalises -- UICR is effectively write-once, LS05B is a distinct security
# variant, and a wrong offset is not recoverable. Confirm the LS05B UICR map first.
#
# Note the STM side of this axis is live regardless: the signer stamps
# monotonic_version into the image's protected security-counter TLV either way, so
# turning this on later needs no re-sign of anything.
# CONFIG_BOOT_PQ_ROLLBACK_PROT=y
# CONFIG_SECURE_BOOT_STORAGE=y
# CONFIG_SECURE_BOOT_CRYPTO=y
