[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ward-relay"
version = "0.1.0"
requires-python = ">=3.9"
description = "The WARD relay shared by Rust and Python HWI hosts"

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "ward_relay._native"
